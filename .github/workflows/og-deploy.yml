name: og-deploy

# OG 分享图 Worker 发布第一段: 只做 wrangler versions upload (不部署)。
# 验收通过后用 og-promote workflow 拿 version_id 手动晋级。
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'yanyun-og/**'
      - '.github/workflows/og-deploy.yml'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Upload OG worker version (preview only, NOT deployed)
        working-directory: yanyun-og
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler versions upload --message "CI ${{ github.sha }}" 2>&1 | tee /tmp/upload.log
          VID=$(grep -oE 'Worker Version ID: [0-9a-f-]{36}' /tmp/upload.log | awk '{print $4}')
          if [ -z "$VID" ]; then echo "::error::could not parse Worker Version ID from wrangler output"; exit 1; fi
          {
            echo "## OG worker version uploaded — NOT deployed"
            echo ""
            echo "- Version ID: \`$VID\`"
            echo "- Verify it first, then promote: run the **og-promote** workflow with \`version_id\` = \`$VID\`"
          } >> "$GITHUB_STEP_SUMMARY"
