name: backend-deploy

# 后端发布第一段 (marcus 裁决 2026-10-25: 先 preview 验证, 再进 prod):
# build web -> 把 dist 拷进 yanyun-signup/public -> 只做 wrangler versions upload
# (上传为新版本, 不部署、不接流量)。验收通过后, 用 backend-promote workflow
# 拿 version_id 手动晋级到 100% 流量。
# 拷贝用 cp -r (不删除目标文件), public 里的 admin 源文件天然保留。
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'yanyun-signup/**'
      - 'yanyun-web/**'
      - 'packages/schema/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build web
        run: npm run build --workspace=yanyun-web
      - name: Copy web dist into backend public (preserves admin sources)
        run: cp -r yanyun-web/dist/. yanyun-signup/public/
      - name: Upload worker version (preview only, NOT deployed)
        working-directory: yanyun-signup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler versions upload --message "CI ${{ github.sha }}" 2>&1 | tee /tmp/upload.log
          VID=$(grep -oE 'Worker Version ID: [0-9a-f-]{36}' /tmp/upload.log | awk '{print $4}')
          if [ -z "$VID" ]; then echo "::error::could not parse Worker Version ID from wrangler output"; exit 1; fi
          {
            echo "## Backend version uploaded — NOT deployed"
            echo ""
            echo "- Version ID: \`$VID\`"
            echo "- Verify it first, then promote: run the **backend-promote** workflow with \`version_id\` = \`$VID\`"
          } >> "$GITHUB_STEP_SUMMARY"
