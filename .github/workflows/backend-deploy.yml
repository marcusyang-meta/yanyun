name: backend-deploy

# Post-merge auto-promote — the ONLY path to production for the backend.
# Triggered solely by a merged pull request. There is deliberately no
# workflow_dispatch and no manual promote entry anywhere: an emergency fix
# lands the same way everything else does, as a PR that goes green and
# merges. Verification already happened on the PR (pr-backend: static gates,
# the full vitest suite, real-D1 verification, preview probes, real-browser
# render smoke). This workflow:
#   1. finds the successful pr-backend run for the PR head and downloads the
#      exact artifact it built (never rebuilds),
#   2. refuses to run unless the merged tree is identical to the tree that
#      run verified (fail-closed if master moved under the PR),
#   3. applies any pending D1 migrations from the merged tree
#      (wrangler d1 migrations apply --remote) — a failed apply blocks
#      the promote, fail-closed. Schema is NOT rolled back with the
#      code: migrations must be expand/contract so the applied schema
#      stays compatible with the previous code version,
#   4. records the current production version, deploys the artifact,
#   5. runs the read-only production probes and, on any failure, rolls
#      production back to the recorded version and fails the run.
# A direct push to master triggers nothing (no push trigger anywhere), so
# the PR gate cannot be bypassed by pushing.
on:
  pull_request:
    types: [closed]
    branches: [master]
    paths:
      - 'yanyun-signup/**'
      - 'yanyun-web/**'
      - 'packages/schema/**'
      - '.github/workflows/pr-backend.yml'
      - '.github/workflows/backend-deploy.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  promote:
    name: promote the PR-verified artifact
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      CF_API: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts/yanyun/deployments
    steps:
      - name: Locate the green pr-backend run for this PR head
        id: locate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/pr-backend.yml/runs?head_sha=$HEAD_SHA&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.event == "pull_request")][0].id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful pr-backend run found for PR head $HEAD_SHA — refusing to promote unverified code."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Verified by pr-backend run $RUN_ID"
      - name: Refuse unless the merged tree is the verified tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_TREE=$(gh api "repos/${{ github.repository }}/git/commits/$HEAD_SHA" --jq .tree.sha)
          MERGE_TREE=$(gh api "repos/${{ github.repository }}/git/commits/$MERGE_SHA" --jq .tree.sha)
          echo "verified tree: $HEAD_TREE"
          echo "merged tree:   $MERGE_TREE"
          if [ "$HEAD_TREE" != "$MERGE_TREE" ]; then
            echo "::error::Merged tree differs from the PR-verified tree (master moved under the PR). Push to the branch so pr-backend re-verifies the updated tree, then merge again."
            exit 1
          fi
      # Checkout must precede the artifact download: actions/checkout
      # cleans the workspace, and when it ran after the download it wiped
      # ci-artifact (backend-deploy run 40319126570 failed in sync-public
      # with "dist index.html not found" — production was never touched).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the verified artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-public
          path: ci-artifact
          run-id: ${{ steps.locate.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the artifact manifest matches this PR
        run: |
          cat ci-artifact/manifest.json
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("ci-artifact/manifest.json", "utf8"));
            if (m.sha !== process.env.HEAD_SHA) { console.error(`manifest sha ${m.sha} != PR head ${process.env.HEAD_SHA}`); process.exit(1); }
            if (Number(m.pr) !== Number(process.env.PR_NUMBER)) { console.error(`manifest PR ${m.pr} != ${process.env.PR_NUMBER}`); process.exit(1); }
            console.log("manifest OK: sha and PR match");
          '
      # Migrations run from the merged tree's migrations/ directory,
      # before anything is deployed. If apply fails, this step fails
      # and the promote never happens (fail-closed). A no-op apply
      # ("no migrations to apply") is the normal case for PRs without
      # schema changes.
      - name: Apply D1 migrations to production
        id: migrate
        working-directory: yanyun-signup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply yanyun-signup --remote
      - name: Record the current production version
        id: prev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PREV=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_API" | jq -r '
            if (.result.deployments[0].versions | length) == 1 and .result.deployments[0].versions[0].percentage == 100
            then .result.deployments[0].versions[0].version_id else empty end')
          if [ -z "$PREV" ]; then
            echo "::error::Cannot pin the current production version (deployments API shape unexpected) — failing closed, nothing deployed."
            exit 1
          fi
          echo "version=$PREV" >> "$GITHUB_OUTPUT"
          echo "Production version before promote: $PREV"
      - name: Deploy the verified bytes to production
        id: deploy
        working-directory: yanyun-signup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/sync-public.mjs --dist "$GITHUB_WORKSPACE/ci-artifact"
          pnpm exec wrangler deploy --message "auto-promote PR #$PR_NUMBER (backend-deploy run ${{ github.run_id }})"
      - name: Record the new production version
        id: newver
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PREV="${{ steps.prev.outputs.version }}"
          NEW=""
          for i in $(seq 1 12); do
            NEW=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_API" | jq -r '.result.deployments[0].versions[0].version_id // empty')
            if [ -n "$NEW" ] && [ "$NEW" != "$PREV" ]; then break; fi
            sleep 5
          done
          if [ -z "$NEW" ] || [ "$NEW" = "$PREV" ]; then
            echo "::error::Production version did not change after deploy — treating as a failed promote."
            exit 1
          fi
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Production version after promote: $NEW"
      - name: Production probes (read-only)
        id: prod_probes
        run: >-
          node yanyun-signup/scripts/ci/probes.mjs
          --base https://yanyun.app
          --tenant jijiguagua --list-tenant jijiguagua
      - name: Roll back to the previous version
        if: ${{ steps.prev.outputs.version != '' && (failure() || steps.prod_probes.outcome == 'failure') }}
        working-directory: yanyun-signup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PREV="${{ steps.prev.outputs.version }}"
          {
            echo "## ⚠️ AUTO-ROLLBACK"
            echo "Promote of PR #$PR_NUMBER failed a production step. Rolling production back to version \`$PREV\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Promote failed — rolling back to $PREV"
          pnpm exec wrangler versions deploy --version-id "$PREV" --percentage 100 --yes \
            --message "auto-rollback of PR #$PR_NUMBER (backend-deploy run ${{ github.run_id }})"
          NOW=""
          for i in $(seq 1 12); do
            NOW=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_API" | jq -r '.result.deployments[0].versions[0].version_id // empty')
            if [ "$NOW" = "$PREV" ]; then break; fi
            sleep 5
          done
          if [ "$NOW" != "$PREV" ]; then
            echo "::error::Rollback attempted but production is still on $NOW, not $PREV — manual intervention required."
            exit 1
          fi
          echo "Rollback confirmed: production is back on $PREV"
      - name: Promote summary
        if: always()
        run: |
          {
            echo "## backend-deploy (auto-promote)"
            echo "- PR: #$PR_NUMBER (head \`$HEAD_SHA\`, merge \`$MERGE_SHA\`)"
            echo "- verified by pr-backend run: ${{ steps.locate.outputs.run_id }}"
            echo "- D1 migrations apply: ${{ steps.migrate.outcome }} (schema stays applied on code rollback — expand/contract)"
            echo "- production version before: \`${{ steps.prev.outputs.version }}\`"
            echo "- production version after: \`${{ steps.newver.outputs.version }}\`"
            echo "- production probes: ${{ steps.prod_probes.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
