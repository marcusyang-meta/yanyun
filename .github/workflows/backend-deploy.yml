name: backend-deploy

# 后端发布第一段 (marcus 裁决 2026-10-25: 先 preview 真渲染验收, 再 promote 进 prod):
# build web 一次 -> 同步 dist 进 yanyun-signup/public -> wrangler preview 发到
# 名为 release 的稳定 Preview (https://release-yanyun.tbdlab.workers.dev),
# 并把这批产物 (index.html + assets/) 存为 artifact backend-public。
# 本 workflow 绝不部署 prod。验收通过后, 用 backend-promote workflow 填本
# run 的 ID, 取回同一批 artifact 部署 prod —— promote 的就是 preview 验过的字节。
#
# 为什么用 wrangler preview 而不是 versions upload: 本 Worker 实现了
# Durable Object (SeatHub/GuildHub), Cloudflare 平台不为 DO Worker 生成
# Version URL (previews_enabled 开着也没有)。Previews 是官方给 DO Worker
# 的预览路线: DO 按 Preview 自动隔离, Cron 不运行; D1 按 database_id 与
# 生产共享 (见 yanyun-signup/wrangler.toml 的 [previews] 块注释), 故验收
# 纪律是匿名只读浏览。
# 同步拷贝走 scripts/sync-public.mjs: 以 dist 为准对齐 index.html + assets/,
# 删除旧哈希残留; public 里的 admin 源文件不碰。
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'yanyun-signup/**'
      - 'yanyun-web/**'
      - 'packages/schema/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build web
        run: npm run build --workspace=yanyun-web
      - name: Stage build artifact (index.html + assets + manifest)
        run: |
          mkdir -p .ci-artifact
          cp yanyun-web/dist/index.html .ci-artifact/index.html
          cp -r yanyun-web/dist/assets .ci-artifact/assets
          cat > .ci-artifact/manifest.json <<EOF
          {"sha":"${{ github.sha }}","run_id":"${{ github.run_id }}","ref":"${{ github.ref_name }}"}
          EOF
          cat .ci-artifact/manifest.json
      - name: Upload build artifact for backend-promote
        uses: actions/upload-artifact@v4
        with:
          name: backend-public
          path: .ci-artifact
          retention-days: 30
      - name: Sync dist into backend public (sync-style, keeps admin sources)
        run: node yanyun-signup/scripts/sync-public.mjs
      - name: Publish to release Preview (NOT production)
        working-directory: yanyun-signup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler preview --name release --message "CI ${{ github.sha }}" --json | tee /tmp/preview.json
          URL=$(jq -r '.url // empty' /tmp/preview.json)
          if [ -z "$URL" ]; then URL="https://release-yanyun.tbdlab.workers.dev"; fi
          echo "preview_url=$URL" >> "$GITHUB_ENV"
          {
            echo "## Backend preview published — production untouched"
            echo ""
            echo "- Preview: $URL"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Verify the preview (real render, anonymous read-only), then promote THIS run's artifact:"
            echo "  run **backend-promote** with \`deploy_run_id\` = \`${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
