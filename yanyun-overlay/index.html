<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box;}
html, body { height: 100%; overflow: hidden; font-family: "Microsoft YaHei", sans-serif;}
body { background: rgba(20, 16, 10, 0.82); color: #f2ecdc; border-left: 3px solid #b8860b;}
#bar {
display: flex; align-items: center; gap: 6px; padding: 8px 10px;
background: rgba(0,0,0,0.35); border-bottom: 1px solid #b8860b55;
-webkit-app-region: drag; user-select: none;
}
#bar.t { font-weight: bold; color: #d4a94e; font-size: 14px; flex: 1;}
#bar button {
-webkit-app-region: no-drag; background: #b8860b33; color: #f2ecdc;
border: 1px solid #b8860b88; border-radius: 4px; padding: 3px 8px;
font-size: 12px; cursor: pointer;
}
#bar button.on { background: #b8860b; color: #111;}
#mode { font-size: 11px; color: #a93226; padding: 0 10px;}
#content { height: calc(100% - 41px); overflow-y: auto; padding: 10px;}
#content::-webkit-scrollbar { width: 6px;}
#content::-webkit-scrollbar-thumb { background: #b8860b66; border-radius: 3px;}
select {
width: 100%; margin-bottom: 8px; padding: 6px; font-size: 13px;
background: #2a241a; color: #f2ecdc; border: 1px solid #b8860b88; border-radius: 4px;
}
.tabs { display: flex; gap: 6px; margin-bottom: 8px;}
.tabs button {
flex: 1; padding: 5px; font-size: 12px; cursor: pointer;
background: transparent; color: #d4a94e; border: 1px solid #b8860b66; border-radius: 4px;
}
.tabs button.on { background: #b8860b; color: #111;}
.guide { font-size: 13px; line-height: 1.7; white-space: pre-wrap;}
.guide b { color: #d4a94e;}
.empty { color: #888; text-align: center; padding: 30px 0; font-size: 13px;}
/* 队长模式 */
#leader { display: none;}
.phase { border: 1px solid #b8860b55; border-radius: 6px; padding: 8px; margin-bottom: 8px;}
.phase h4 { color: #d4a94e; font-size: 13px; margin-bottom: 4px;}
.phase p { font-size: 12.5px; line-height: 1.6;}
.phase.call { color: #ff6b5b; font-weight: bold;}
.timer { font-size: 22px; color: #d4a94e; text-align: center; margin: 8px 0; font-variant-numeric: tabular-nums;}
.tbtns { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px;}
.tbtns button {
padding: 5px 14px; font-size: 12px; cursor: pointer; border-radius: 4px;
background: #b8860b33; color: #f2ecdc; border: 1px solid #b8860b88;
}
#lockHint { font-size: 11px; color: #888; text-align: center; padding: 4px;}
</style>
</head>
<body>
<div id="bar">
<span class="t">⚔️ 燕云开团助手</span>
<button id="modeBtn" title="切换队长模式">队长</button>
<button id="lockBtn" class="on" title="Ctrl+Shift+O">穿透</button>
</div>
<div id="mode"></div>
<div id="content">
<div id="normal">
<select id="bossSel"><option>加载中…</option></select>
<div class="tabs">
<button data-v="mech" class="on">机制</button>
<button data-v="talent">天赋</button>
<button data-v="school">流派</button>
</div>
<div id="guide" class="guide"><div class="empty">选择首领查看攻略</div></div>
<div id="schoolPanel" style="display:none">
<select id="schoolSel"><option>加载中…</option></select>
<div class="tabs">
<button data-sv="bis" class="on">毕业词条</button>
<button data-sv="rot">输出轴</button>
</div>
<div id="schoolGuide" class="guide"><div class="empty">选择流派查看攻略</div></div>
</div>
</div>
<div id="leader">
<select id="bossSel2"><option>加载中…</option></select>
<div class="timer" id="timer">00:00</div>
<div class="tbtns">
<button id="tStart">开始</button>
<button id="tReset">重置</button>
</div>
<div id="phases"></div>
</div>
</div>
<div id="lockHint">Ctrl+Shift+O 穿透/操作 · Ctrl+Shift+X 隐藏</div>
<script>
const API = 'https://yanyun.app';
let bosses = [], curView = 'mech', leaderMode = false;
let schoolGuides = null, curSchoolView = 'bis';
let timerInt = null, timerSec = 0;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 穿透切换
let locked = true;
$('#lockBtn').onclick = () => {
locked =!locked;
window.overlay.setClickThrough(locked);
$('#lockBtn').classList.toggle('on', locked);
$('#lockBtn').textContent = locked? '穿透': '操作';
};
window.overlay.onClickThrough((v) => {
locked = v;
$('#lockBtn').classList.toggle('on', v);
$('#lockBtn').textContent = v? '穿透': '操作';
});

// 队长模式切换
$('#modeBtn').onclick = () => {
leaderMode =!leaderMode;
$('#modeBtn').classList.toggle('on', leaderMode);
$('#normal').style.display = leaderMode? 'none': '';
$('#leader').style.display = leaderMode? 'block': 'none';
$('#mode').textContent = leaderMode? '队长模式：手动计时 + 阶段喊话': '';
};

// 加载首领
async function loadBosses() {
try {
const r = await fetch(API + '/api/bosses');
const d = await r.json();
bosses = (d.bosses || []).filter((b) => b.guide);
const opts = bosses.map((b) => `<option value="${b.id}">${esc(b.name)}</option>`).join('');
$('#bossSel').innerHTML = opts;
$('#bossSel2').innerHTML = opts;
if (bosses.length) { showGuide(); showPhases();}
} catch {
$('#bossSel').innerHTML = '<option>加载失败</option>';
}
}

function parseGuide(g) {
// 简单分段：按标题切
const parts = {};
const re = /]+)】/g;
let m, last = 0, lastKey = '说明';
const keys = [];
while ((m = re.exec(g))) {
if (keys.length) parts[keys[keys.length - 1]] = g.slice(last, m.index).trim();
keys.push(m[1]); last = m.index + m[0].length;
}
if (keys.length) parts[keys[keys.length - 1]] = g.slice(last).trim();
return parts;
}

function showGuide() {
const b = bosses.find((x) => x.id == $('#bossSel').value);
if (!b) return;
const parts = parseGuide(b.guide || '');
let text = '';
if (curView === 'mech') {
text = parts['机制'] || parts['说明'] || b.guide || '';
} else {
// 天赋部分
const m = (b.guide || '').match(/]*】([\s\S]*)/);
text = m? m[1].trim(): '暂无天赋数据';
}
$('#guide').innerHTML = `<b>${esc(b.name)}</b>\n\n` + esc(text);
}

document.querySelectorAll('#normal .tabs button').forEach((btn) => {
btn.onclick = () => {
document.querySelectorAll('#normal .tabs button').forEach((x) => x.classList.remove('on'));
btn.classList.add('on');
curView = btn.dataset.v;
// 切换面板
if (curView === 'school') {
$('#bossSel').style.display = 'none';
$('#guide').style.display = 'none';
$('#schoolPanel').style.display = '';
if (!schoolGuides) loadSchoolGuides();
} else {
$('#bossSel').style.display = '';
$('#guide').style.display = '';
$('#schoolPanel').style.display = 'none';
showGuide();
}
};
});
$('#bossSel').onchange = showGuide;

// 流派攻略：从后端取
async function loadSchoolGuides() {
try {
const r = await fetch(API + '/api/demo/school-guides');
const d = await r.json();
if (d.ok) {
schoolGuides = d;
const schools = Object.keys(d.bis || {});
$('#schoolSel').innerHTML = schools.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
if (schools.length) showSchoolGuide();
}
} catch {
$('#schoolSel').innerHTML = '<option>加载失败</option>';
}
}

function showSchoolGuide() {
if (!schoolGuides) return;
const s = $('#schoolSel').value;
let html = '';
if (curSchoolView === 'bis') {
const builds = schoolGuides.bis[s];
if (builds) {
for (const [buildName, d] of Object.entries(builds)) {
html += `<b>${esc(s)} - ${esc(buildName)}</b> 主属性 ${esc(d.attr)}<br><br>` +
d.bis.map(([slot, desc]) => `<b>${esc(slot)}</b>：${esc(desc)}`).join('<br>') + '<br><br>';
}
}
} else {
const d = schoolGuides.rotations[s];
if (d) {
html = `<b>${esc(s)}</b><br><br>` +
d.map(([t, desc]) => `<b>${esc(t)}</b>：${esc(desc)}`).join('<br><br>');
}
}
$('#schoolGuide').innerHTML = html || '<div class="empty">暂无数据</div>';
}

$('#schoolSel').onchange = showSchoolGuide;
document.querySelectorAll('#schoolPanel .tabs button').forEach((btn) => {
btn.onclick = () => {
document.querySelectorAll('#schoolPanel .tabs button').forEach((x) => x.classList.remove('on'));
btn.classList.add('on');
curSchoolView = btn.dataset.sv;
showSchoolGuide();
};
});

// 队长模式：阶段喊话（从机制文本提取关键点，手动简化版）
function showPhases() {
const b = bosses.find((x) => x.id == $('#bossSel2').value);
if (!b) return;
const parts = parseGuide(b.guide || '');
const mech = parts['机制'] || '';
// 按数字编号切阶段
const phases = mech.split(/\n(?=\d+\.)/).filter((s) => s.trim()).slice(0, 6);
$('#phases').innerHTML = phases.length
? phases.map((p, i) => {
const lines = p.trim().split('\n');
const title = lines[0] || `阶段 ${i + 1}`;
const body = lines.slice(1).join('\n');
return `<div class="phase"><h4>${esc(title)}</h4><p>${esc(body)}</p></div>`;
}).join('')
: '<div class="empty">暂无分阶段数据</div>';
}
$('#bossSel2').onchange = showPhases;

// 计时器
function fmt(s) {
const m = Math.floor(s / 60), ss = s % 60;
return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
}
$('#tStart').onclick = () => {
if (timerInt) {
clearInterval(timerInt); timerInt = null;
$('#tStart').textContent = '继续';
} else {
$('#tStart').textContent = '暂停';
timerInt = setInterval(() => { timerSec++; $('#timer').textContent = fmt(timerSec);}, 1000);
}
};
$('#tReset').onclick = () => {
clearInterval(timerInt); timerInt = null; timerSec = 0;
$('#timer').textContent = '00:00';
$('#tStart').textContent = '开始';
};

loadBosses();
</script>
</body>
</html>
