# ============ Cross-guild network (P19 fill market / P20 allied guilds) ============
# Per-edge pricing (DESIGN.md S9): the supply side is free
# (publishing supply and answering invites never consult a tier);
# the demand side is T3, composed by tierSurfaceState (below tier
# with the paygate ON, the demand section composes as
# FillDemandLocked with zero demand data delivered; below tier
# with the paygate OFF the demand field is null and the section
# does not exist; demand mutations re-verify with the pure
# tierLocked verdict server-side in every paygate state). The
# market matches, it never decides: accepting an
# invite seats nobody; seating is the demand-side leader's manual
# action in seatFillSupplier (through the existing capacity-guard
# seat insert). Alliance sharing is a read-time verdict:
# dissolving an alliance takes effect immediately, no cleanup
# writes.

union FillMarketResult = FillMarketPage | FillMarketLocked

type FillMarketPage {
  slug: String!
  guildName: String!
