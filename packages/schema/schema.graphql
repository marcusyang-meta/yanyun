type MySeasonGoalPage {
  # 文案 (officer 目录, 后端按请求 locale 生成; 前端零字符串)
  entryLabel: String!
  title: String!
  hint: String!
  emptyText: String!
  guildLabel: String!
  goalTitleLabel: String!
  goalTitlePlaceholder: String!
  goalNoteLabel: String!
  goalNotePlaceholder: String!
  dungeonLabel: String!
  dungeonNoneLabel: String!
  statusLabel: String!
  addLabel: String!
  saveLabel: String!
  editLabel: String!
  deleteLabel: String!
  statusActiveLabel: String!
  statusDoneLabel: String!
  statusDroppedLabel: String!
  # 我在各百业的目标 (跨百业汇总, 每条带所属百业名); 可建目标的
