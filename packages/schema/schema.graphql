# P15 race season board: single-run records (the results entity)
# stay free and untouched; this board only adds the cross-run /
# season aggregation. Cars are bucketed by their dungeon's dex
# season (dungeons.season); unknown or unclassified dungeons land
# in the unclassified bucket (empty season). Entries are per team
# (results are team records): runs = the team's result rows that
# season, wins = distinct cars where its row was the fastest,
# best = its fastest single run that season. Order: wins desc,
# best asc, runs desc.
