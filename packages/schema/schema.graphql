# ============ 百业管理面 (原 gadmin, 2026-10-26 迁 GraphQL) ============
# 入口 Viewer.guildAdmin(slug): 鉴权 = Discord 会话 + 查看者是该百业
# 所绑 Discord 服务器的管理员 (与 createGuild 同一校验: 服务器主或
# Administrator / ManageGuild 位)。权限只由响应类型表达: GuildAdmin
# 携带全部管理数据与文案; GuildAdminLocked 只带 slug 与本页文案, 不带
# 任何百业数据。所有 admin 变更在 resolver 内复验同一结论, 不信前端。
# 原 gadmin 的百业密码登录随迁移废弃 (Discord 会话是唯一身份)。
# 提醒 Webhook 是密钥: 只下发是否已设置 + Webhook 数字编号 (可辨认
# 频道, 不可用于发帖), 完整 URL 永不回读 (与超管门户保存后掩码同规)。

union GuildAdminResult = GuildAdmin | GuildAdminLocked

type GuildAdminLocked {
  slug: String!
  adminLockedTitle: String!
  adminLockedBody: String!
  adminBackLinkLabel: String!
}

type GuildAdmin {
  slug: String!
  name: String
  announcement: String!
  slogan: String
  masterName: String!
  logoUrl: String!
  bgImageUrl: String!
  avatarUrl: String
  avatarUpdatedAt: String
  discordGuildId: String!
  reminderWebhookSet: Boolean!
  reminderWebhookId: String
  reminderOffsets: [Int!]!  # 发车提醒提前量 (分钟, 管理员多选; 默认 [10])
  reminderCustomText: String!  # 发车提醒自定义文案 (一行, 空 = 不显示)
  # 白标进阶 (Premium 第一梯队, 不挂 gate): 只挂 GuildAdmin — Locked
  # 零设置字段。强调色只能从 ogAccentOptions 的服务端色板里选 key,
  # 不接受自由色值; 标题后缀一行文本 (空 = 无后缀)。
  whiteLabelHideBranding: Boolean!
  ogAccent: String!  # 当前强调色 key (空 = 未定制)
  ogTitleSuffix: String!
  ogAccentOptions: [GuildAdminOgAccentOption!]!
  # 平台子域 (白标档 A) 不在此挂任何字段: 开关归平台 (hub 操作面),
  # 能力先建后藏, Premium 正式推出前对百业侧完全不可见。
  # 本百业页面的有效页脚声明 (白标组合, 与成员面 Guild 同口径):
  # 隐藏品牌时为 null, 管理页所在的站点外壳据此不渲染页脚。
  pageFooterDisclaimerText: String
  devOnly: Boolean!
  gameVersion: String!
  events: [GuildAdminEvent!]!
  schoolGuides: GuildAdminSchoolGuides!
  # 公告广播 (F9/F10/F18) 管理变体: 发布表单 + 每日余量 + 已读回执;
  # 只挂 GuildAdmin — Locked 零公告字段。
  announcements: GuildAnnouncementPage!
  # 军官工具 (免费功能线 F12/F11/F19, 不挂任何权益门): 成员备注 +
  # 数据包导出 + 成员赛季目标总览; 只挂 GuildAdmin — Locked 零工具
  # 字段, 成员变体 (Guild) 根本不带备注字段。
  officer: GuildOfficerPage!
  ops: GuildAdminOpsResult
  # 赛季滚动 (P12, 2026-11-07 裁定转免费): 只挂 GuildAdmin — 管理员
  # 判定即唯一的门, 不查档位/权益, 总闸任何状态下都完整下发。
  seasonRollover: GuildAdminSeasonRollover!
  # AI recap index (P18, Premium T3): this guild's recap records;
  # the verdict composes in the same order as the detail page —
  # null (below T3, paygate OFF) / Locked (below T3, paygate ON,
  # zero records read) / NotEnabled (no provider configured) /
  # List. GuildAdmin only — Locked carries zero recap fields.
  recaps: GuildAdminRecapResult
  # Combat report index (combat reports v1, T2): the verdict
  # composes like the detail surface — null (below T2, paygate
  # OFF) / Locked (below T2, paygate ON, zero rows read) / List.
  # GuildAdmin only — Locked carries zero encounter fields.
  combatReports: GuildAdminCombatReportResult
  # 出勤统计 (Premium, 读侧门控): 总闸开且本百业未开通时组合为
  # GuildAdminStatsLocked (只有未开通文案, 零统计数据); 总闸关或
  # 已开通时与从前一致。结论只由响应类型表达, 无标志位下发。
  stats: GuildAdminStatsResult!
  # Insights (Premium T1 data layer, P2/P9/P10/P15): each surface
  # composes by tierSurfaceState — the full variant, or
  # GuildInsightsLocked (locked copy only, zero data, the
  # aggregation is never computed) while the paygate is ON, or
  # null while it is OFF; GuildAdmin only — the locked guild shell
  # ships no insight fields at all. See each type's comment for
  # its caliber.
  reliability: GuildAdminReliabilityResult
  participationHeatmap: GuildAdminHeatmapResult
  gearBoard: GuildAdminGearBoardResult
  raceSeasonBoard: RaceSeasonBoardResult
  # Premium 权益面: 总闸关时为 null (管理面与从前逐字一致, 该面
  # 不出现); 总闸开时按权益组合 Active / Locked 变体 — Locked 带
  # 价格位与开通入口 (Stripe 未配置时价格位为 null、改由即将开放
  # 文案占据), Active 带方案来源与当前周期。
  premium: GuildAdminPremiumResult
  # Custom domain (P23, T3 governance layer): the verdict is expressed
  # by the response type — at tier it composes as the full variant
  # (binding + state-machine status + server-issued DNS guidance);
  # below T3 with the paygate ON it composes as
  # GuildAdminCustomDomainLocked (locked copy only, zero binding data);
  # below T3 with the paygate OFF it is null and the section does
  # not exist.
  customDomain: GuildAdminCustomDomainResult
  # 活动工具 (免费功能, 不挂任何权益门): 活动日历订阅 (F8) + 活动
  # 抽奖 (F21), 只挂 GuildAdmin — Locked 零工具字段。日历订阅链在
  # 抽奖的名单在创建时定格 (来源: 某辆车的参与者, 或手选本百业
  # 成员), 开奖不重复中奖, 抽奖/名单/权重/结果全部留痕, 由
  # lotteries 字段回读。
  lotteries: [GuildAdminLottery!]!
  lotteryRoster: [GuildAdminLotteryMember!]!
  # 赛季前检查清单 (免费功能, 不挂 gate): 条目由后端按当前版本/赛季
  # 数据组合下发, 勾选状态按百业 + 赛季持久化; 只挂 GuildAdmin。
  seasonChecklist: GuildSeasonChecklist!
  # 成员名册 (免费功能, 不挂 gate): 游戏内名字名册, 与 Discord 成员
  # 资格 (guild_members) 正交; 截图 OCR 导入经待确认预览才落库。
  roster: GuildRoster!
  # 招新新人线 (免费功能, 不挂任何权益门): 招新开关、入业申请审核
  # 队列 (F16)、导师人选与配对 (F17)、新人清单进度总览 (F24); 只挂
  # GuildAdmin — Locked 零招新字段。审核/配对写操作全部走下方
  # mutation 并在 resolver 内复验管理结论。通过申请的平台侧效果 =
  # 申请结案 + 登记进本百业名册; Discord 服务器成员身份平台无写
  # 通道 (无 bot 令牌, OAuth 为用户只读授权), 申请人通过后自行
  # 加入绑定服务器 —— 主页招新区的 approvedNextStep 文案逐字
  # 说明这一步。
  # 招新开关 (tenants.recruit_open, 默认关): 开启的百业才进平台
  # 主页招新目录并接受入业申请; 成员的新人拼装不看此开关。
  recruitOpen: Boolean!
  recruitApplications: [RecruitApplication!]!
  recruitPairings: [MentorPairing!]!
  recruitRoster: [RecruitMember!]!
  newcomerProgress: [NewcomerProgress!]!
  # Insights page copy (guildAdmin catalog)
  adminTabInsightsLabel: String!
