# ============ AI activity recaps (Premium T3, P18) ============
# The recap body is provider-generated content, not UI copy:
# paragraphs are dispatched verbatim and never enter the strings
# catalog; every shell string is composed by the backend per locale.

union GroupingRecapResult = GroupingRecapReady | GroupingRecapLocked | GroupingRecapNotEnabled | GroupingRecapEmpty

# Generate/regenerate action group: rides only the Ready/Empty
# variants, and exists only when the viewer can manage this
# grouping (leader or this guild's admin) and it is completed;
# the mutation re-verifies everything server-side.
type GroupingRecapActions {
  generateLabel: String!
  regenerateLabel: String!
  generatingLabel: String!
  confirmTitle: String!
  confirmMessageTemplate: String!
  toastGenerated: String!
  toastFailedTemplate: String!
}

type GroupingRecapReady {
  title: String!
  # Recap body paragraphs (generated content, in generation order)
  paragraphs: [String!]!
  # Data-snapshot summary lines (composed by the backend from the
  # stored snapshot summary, per locale)
  summaryLines: [String!]!
  generatedAtText: String!
  providerText: String!
  versionText: String!
  # Hint shown when the latest generation attempt failed (the
  # earlier successful recap still displays); null when no failure
  failedHint: String
  actions: GroupingRecapActions
}

type GroupingRecapEmpty {
  title: String!
  body: String!
  failedHint: String
  actions: GroupingRecapActions
}

# Below T3: locked copy only — zero recap content, zero provider state.
type GroupingRecapLocked {
  title: String!
  body: String!
}

# No AI provider configured (Workers AI binding absent): every
# guild, T3 included, gets this variant.
type GroupingRecapNotEnabled {
  title: String!
  body: String!
}

type RecapPayload {
  ok: Boolean!
  recap: GroupingRecapResult
  error: String
  errorCode: String
}

# ============ Combat reports (Premium T2) ============
# One imported encounter file = one attempt; a grouping holds
# many (1:N). The report body is computed data (damage numbers,
# intervals), dispatched as structured fields for the client to
# render; every label is composed by the backend per locale.

union GroupingCombatReportResult = GroupingCombatReportReady | GroupingCombatReportLocked | GroupingCombatReportEmpty

enum CombatEncounterResult {
  KILL
  WIPE
  UNKNOWN
}

# Import/delete copy group: rides the Ready and Empty variants.
# The import control posts the file to the HTTP import route;
# every error reason the route can return has its label here, so
# the client maps error codes to copy it was given, never its own.
type CombatReportActions {
  importLabel: String!
  importingLabel: String!
  importHint: String!
  toastImported: String!
  toastImportFailedTemplate: String!
  importErrorFormat: String!
  importErrorValidation: String!
  importErrorLimit: String!
  importErrorForbidden: String!
  importErrorNotFound: String!
  importErrorTier: String!
  deleteLabel: String!
  deleteConfirmTitle: String!
  deleteConfirmMessageTemplate: String!
  toastDeleted: String!
  toastDeleteFailedTemplate: String!
}

# Per-encounter delete affordance: the object exists only on
# rows the viewer may delete (uploader, leader, or this guild's
# admin) — presence is the verdict, no flag is dispatched.
type CombatEncounterDeleteAction {
  deleteLabel: String!
  confirmTitle: String!
  confirmMessageTemplate: String!
  toastDeleted: String!
  toastDeleteFailedTemplate: String!
}

type CombatEncounterSummary {
  id: ID!
  bossName: String!
  startedAtText: String!
  durationText: String!
  result: CombatEncounterResult!
  resultText: String!
  teamDpsText: String!
  uploaderText: String!
  sourceText: String!
  deleteAction: CombatEncounterDeleteAction
}

type CombatPartyRow {
  playerName: String!
  # Roster display name when the character name matched a guild
