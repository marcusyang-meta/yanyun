  # JS getDay 对齐), 整表按 locale 生成。移动端的组头由服务端在 Block
  # 树里拼好整句 (SectionHeaderBlock), 不经这两个字段。
  dayGroupHeaderTemplate: String!
  weekdayNames: [String!]!
  undatedGroupLabel: String!
  emptyInteractiveText: String!
  statusOpenLabel: String!
  peopleTemplate: String!
  newCarLabel: String!
  sealText: String!
  # 发车表单文案 (表单从列表页打开; 详情页 shell 同名同口径)
  formCreateTitle: String!
  formEditTitle: String!
  formTypeLabel: String!
