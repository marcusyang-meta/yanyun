# ============ 页面：平台管理 (超管面) ============
# URL: /platform-admin — 主站内路由, 与主站同源/同会话/同构建 (原独立
# hub 门户 /api/hub/* + 密码门已退役, 能力全量并入本面)。
# 入口 Viewer.platformAdmin: 超管判定在 gating 层求值
# (platform/admin-gate.ts, 主体 = viewer 的 Discord ID; VC/会话只承载
# 身份, 不盖任何判定标记)。gate 开才组成 PlatformAdmin; 非超管 (含
# 未登录) 只拿到 PlatformAdminLocked — 零管理数据下发。每个 mutation
# 服务端二次求值同一 gate, 非超管回 errorCode platformAdminRequired。
# 审计 actor 记操作者的真实用户 ID (不再是笼统的 hub)。
# 备份文件下载不走 GraphQL (流式文件下载): 走普通 HTTP 路由
# /api/platform-admin/backup/export|download, 鉴权 = 主会话 + 同一
# gate 求值; 备份列表与触发备份走本面字段/mutation。

union PlatformAdminResult = PlatformAdmin | PlatformAdminLocked

type PlatformAdminLocked {
  lockedTitle: String!
  lockedBody: String!
}

