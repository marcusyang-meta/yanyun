  # imports, whose cast list is complete
  castsLocalTitle: String
  timelineTitle: String!
  # Raw encounter length: the chart geometry input for the
  # buff-tab gantt (all copy still arrives as text fields)
  durationMs: Int!
  partyRows: [CombatPartyRow!]!
  skillTables: [CombatSkillTable!]!
  buffRows: [CombatBuffRow!]!
  castRows: [CombatCastRow!]!
  dpsSeries: [CombatDpsPoint!]!
}

type GroupingCombatReportReady {
  title: String!
  encountersTitle: String!
  viewReportLabel: String!
  backLabel: String!
  tabOverviewLabel: String!
  tabDamageLabel: String!
  tabBuffsLabel: String!
  tabCastsLabel: String!
  tabTimelineLabel: String!
  encounters: [CombatEncounterSummary!]!
