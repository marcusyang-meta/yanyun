# ============ Mutations ============

type Mutation {
  # 组队（无管理码，人人可管；唯一例外：编辑/解散/完成/恢复仅车头或本百业管理员可为）
  createGrouping(input: CreateGroupingInput!): GroupingPayload!
  cloneGrouping(input: CloneGroupingInput!): CloneGroupingPayload!  # 再来一车: 复制配置与座位名单为新车; 仅原车车头或本百业管理员, 服务端复验
  updateGrouping(id: ID!, input: UpdateGroupingInput!): GroupingPayload!
  disbandGrouping(id: ID!): DeletePayload!  # 解散车队：仅车头或本百业管理员可为，服务端复验
  completeGrouping(id: ID!): GroupingPayload!  # 完成车队：仅车头或本百业管理员可为，服务端复验；完成车不进列表、不发提醒
  generateGroupingRecap(id: ID!): RecapPayload!  # Generate/regenerate an AI recap (P18, T3): leader or this guild's admin only, completed groupings only, manual trigger; the server re-verifies tier and provider
  deleteCombatEncounter(id: ID!): CombatReportPayload!  # Delete one combat encounter report: the uploader, the leader, or a guild admin only; the server re-verifies the tier write verdict
  reopenGrouping(id: ID!): GroupingPayload!  # 恢复车队（撤销完成，回到 open）：仅车头或本百业管理员可为，服务端复验
  mergeGrouping(input: MergeGroupingInput!): GroupingPayload!  # 合并车队（免费）：源车座位整行并入目标车、源车按解散语义收尾；同百业同类型报名中、竞速不支持，操作者须对两车均可管理，服务端复验
  joinGrouping(input: JoinGroupingInput!): SeatPayload!
  leaveGrouping(input: LeaveGroupingInput!): SeatPayload!
  updateSeatWeapon(input: UpdateSeatWeaponInput!): SeatPayload!
  setSeatReady(input: SetSeatReadyInput!): SeatPayload!  # 就位/取消就位: 仅本人身份戳座位, 服务端复验
  createGroupingTemplate(input: CreateGroupingTemplateInput!): GroupingTemplatePayload!  # 存模板: 本百业可写成员
  saveGroupingTemplate(input: SaveGroupingTemplateInput!): GroupingTemplatePayload!  # 把一辆现有车存为模板: 本百业可写成员
  updateGroupingTemplate(id: ID!, input: GroupingTemplateInput!): GroupingTemplatePayload!  # 改模板: 仅创建者或本百业管理员, 服务端复验
  deleteGroupingTemplate(id: ID!): DeletePayload!  # 删模板: 仅创建者或本百业管理员, 服务端复验

  # 调律推演（服务端严格按 Excel 公式计算）
  calcTiaolv(input: TiaolvInput!): TiaolvResult!

  # 毕业率计算（6格平均，服务端计算）
  calcGraduation(input: GraduationInput!): GraduationResult!
}

# 毕业率输入：8部位，每部位6格（1主+4副+1定音）
# 口径：50%条数匹配 + 30%数值达成 + 20%三率达标（参考 gear-planner）
input GraduationInput {
  sectSlug: String!  # 流派slug，用于获取目标配方
  items: [GraduationItemInput!]!
  precision: Float  # 三率：精准
  crit: Float       # 三率：会心
  affinity: Float    # 三率：会意
}

input GraduationItemInput {
  slot: String!  # 部位标识: GradPage.gradSlots 的 id (旧客户端可传规范名 主武器/副武器/…); 服务端不以此计算, 仅在结果中原样回显
  affixes: [AffixValueInput!]!
}

input AffixValueInput {
  key: String!      # 词条key，如 max_atk
  value: Float!     # 数值
  resonance: Boolean! # 是否承音
}

type GraduationResult {
  total: Float!           # 总毕业率 0-100
  countScore: Float!      # 条数匹配度 0-100
  valueScore: Float!      # 数值达成度 0-100
  rateScore: Float!       # 三率达标度 0-100
  items: [GraduationItemResult!]!
}

type GraduationItemResult {
  slot: String!
  score: Float!           # 单件 0-100
}

input CreateGroupingInput {
  slug: String!
  title: String!
  type: GroupingType!
  startsAt: String!
  dungeonId: ID
  seats: [SeatInput!]
  # 自定义报名表字段: 直接定义, 或由客户端从所选模板带入 (模板字段
  # 在建车时被复制为本车自己的字段行, 之后与模板互不影响)
  customFields: [CustomFieldInput!]
}

input SeatInput {
  # 名字锁 (2026-11-01) + 名册限定 (2026-11-02): 有平台身份的人只能
  # 以身份链名字落座 — 带身份戳的座位、以及按解析链命中名册/同服成
  # 员/游戏名名册的名字, 服务端一律改写为该人的名册/身份名, 客户
  # 端传值不作数; 解析不到任何人的名字整单拒绝 (错误列出未解析的
  # 名字), 不落库。
  nickname: String!
  weapon: String!
}

input UpdateGroupingInput {
  title: String
  startsAt: String
  seats: [SeatInput!]
}

input MergeGroupingInput {
  targetId: ID!  # 存续的目标车 (标题/时间/副本/容量以它为准)
  sourceId: ID!  # 被并入的源车 (座位迁走后按解散语义收尾)
}

input JoinGroupingInput {
  groupingId: ID!
  # 兼容保留: 落座名字一律由服务端定 (自己报名 = 本人 Discord 服务器
  # 昵称回退全局名; 代报名 = 名册名), 客户端传值不作数。
  nickname: String!
  weapon: String!
  seatIndex: Int!
  # 代报名: 被代报成员的 Discord ID (必须在本百业名册内, 服务端复验);
  # 缺省 = 为自己报名, 座位恒落本人身份戳。
  forDiscordId: ID
  # 自定义报名表答案 (按本车 customFields 的 fieldId 作答; 必填与
  # 单选合法性由服务端按字段定义复验)
  answers: [SignupAnswerInput!]
}

input LeaveGroupingInput {
  groupingId: ID!
  uid: String!
}

input UpdateSeatWeaponInput {
  groupingId: ID!
  uid: String!
