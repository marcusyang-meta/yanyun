# null at all other times.
type GuildAdminPremiumActive {
  premiumPlanLabel: String!
  premiumSourceText: String!
  premiumPeriodEndText: String
  premiumPastDueText: String
}

# One tier of the pricing surface: tier name / subtitle / monthly
# price are all composed and served by the backend (the tier
# catalog lives in the backend billing service, names go through
# i18n, prices are formatted from the catalog amounts) — the
# client hardcodes no tier name or amount. This type appears only
# on the Locked variant of GuildAdmin.premium: that surface is
# itself gated by the paygate master switch (switch OFF composes
# premium as null and serves zero prices), and no feature's
# tier-locked shell carries this type.
type GuildAdminPremiumTierPlan {
  tier: Int!
  name: String!
  subtitle: String!
  priceLabel: String!
}

# Locked variant: upsell copy + price slot + checkout entry + the
# three-tier pricing. Prices render only backend-composed data
# (premiumPriceLabel is the current plan price read back from
# Stripe, premiumTierPlans is the backend tier catalog's monthly
# prices); with Stripe unconfigured, premiumPriceLabel is null
# and premiumComingSoonText takes its place — the client
# hardcodes no amount.
type GuildAdminPremiumLocked {
  premiumTitle: String!
  premiumBody: String!
  premiumPriceLabel: String
  premiumComingSoonText: String
  premiumCheckoutLabel: String!
  premiumTierPlans: [GuildAdminPremiumTierPlan!]!
}

# Custom domain state machine (P23): NONE = unbound / PENDING = awaiting
# verification (including the platform seam not yet connected, with the
# sub-state expressed by the statusText copy) / ACTIVE = live /
# DISABLED = switched off by the platform.
enum CustomDomainStatus {
  NONE
  PENDING
  ACTIVE
  DISABLED
}

