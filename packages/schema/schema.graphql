# ============ 自定义报名表字段 (F7) ============
# 创建者为组队/模板定义的报名字段: 类型是受约束小集 (单行文本 /
# 单选), 字段数与长度上限由后端校验。label 与 options 是创建者写
# 的数据, 不是 UI 文案; 答案只对车头与本百业管理员可见。

enum CustomFieldType {
  TEXT
  CHOICE
}

type CustomField {
  id: ID!
  label: String!
  fieldType: CustomFieldType!
  options: [String!]!
  required: Boolean!
}

input CustomFieldInput {
  label: String!
  fieldType: CustomFieldType!
  options: [String!]
  required: Boolean
}

input SignupAnswerInput {
  fieldId: ID!
  value: String!
}

# 名册答案行: 仅当观看者可管理本车时由详情页下发 (否则字段为 null)
type RosterAnswer {
  uid: String!
  nickname: String!
  fieldId: ID!
  fieldLabel: String!
  value: String!
}

# ============ 车队模板 (百业共享) ============
# 成员把常用建车配置存为模板, 建车时一键预填表单。模板只存相对发车
# 偏移 (天数 + 当地时刻), 不存绝对日期; 副本存名称 (与 events.dungeon
# 同口径), dungeonId 按当前图鉴实时解析, 副本下线时为 null。

type GroupingTemplate {
  id: ID!
  name: String!
  type: GroupingType!
  title: String!
  dungeonName: String
  dungeonId: ID
  maxSlots: Int!
  startDaysAhead: Int!
  startHour: Int!
  startMinute: Int!
  creatorDiscordId: String
  creatorName: String
  # 改删动作对象: 仅模板创建者或本百业管理员可见, 否则 null;
  # mutation 处以同一判定独立复验。
  manageActions: GroupingTemplateManageActions
  # 本模板的自定义报名表字段: 发车时随模板带入车的字段定义
  customFields: [CustomField!]!
}

type GroupingTemplateManageActions {
  editLabel: String!
  deleteLabel: String!
  deleteConfirmTitle: String!
  deleteConfirmMessageTemplate: String!
}

# 详情页「存为模板」动作对象: 仅可在本百业写的观看者可见。
type GroupingTemplateSave {
  buttonLabel: String!
  dialogTitle: String!
  nameLabel: String!
  submitLabel: String!
  toastSaved: String!
  toastFailedTemplate: String!
}

# 详情页「再来一车」动作对象: 仅当观看者可管理本车时存在 (与
# manageActions 同一判定: 车头本人, 或本百业管理员); 否则为 null,
# 客户端不渲染复制入口。cloneGrouping mutation 处独立复验。
# defaultStartsAt 是服务端按观看者时区算出的默认出发时刻 (epoch 秒
# 字符串): 沿用原车在其时区的时刻, 日期顺延到最近的同星期几 (原车
# 无出发时间时为当天 20:00); 客户端的时间选择器以此为初值。
type GroupingCloneAction {
  buttonLabel: String!
  dialogTitle: String!
  toastCloned: String!
  toastFailedTemplate: String!
  toastSkippedTemplate: String!
  defaultStartsAt: String!
}

# 详情页「催报名」动作对象 (免费功能): 仅当观看者可管理本车时存在
# (车头本人, 或本百业管理员), 否则为 null, 客户端不渲染入口。
# text 是服务端整段生成好的催报名文案: 本百业名册中尚未报名本车
# 的成员以真实 Discord 提及 (<@id>) 列出, 与提醒 webhook 同一提及
# 口径; 客户端只负责复制, 平台不代发任何 Discord 消息。名册全员
# 已报名时 text 为 null、emptyText 给出说明。
type GroupingNudgeCopy {
  buttonLabel: String!
  dialogTitle: String!
  hintText: String!
  text: String
  emptyText: String
  copyLabel: String!
  copiedToast: String!
  candidateCount: Int!
}

type CloneGroupingPayload {
  ok: Boolean!
  grouping: Grouping
  # 复制时没能带入新车的原车座位名字: 名字在各名册上解析不到任何人
  # (存量占位名), 座位被跳过、名单回给操作者; 成功时可能为空表。
  skippedNames: [String!]!
  error: String
  errorCode: String
}

input CloneGroupingInput {
  groupingId: ID!
  # 新车标题; 缺省沿用原车标题。
  title: String
  # 新车出发时刻 (epoch 秒字符串, 与 CreateGroupingInput.startsAt 同口径)。
  startsAt: String!
}

type GroupingTemplatePayload {
  ok: Boolean!
  template: GroupingTemplate
  error: String
  errorCode: String
}

input GroupingTemplateInput {
  name: String!
  type: GroupingType!
  title: String!
  dungeonId: ID
  startsInDays: Int!
  startHour: Int!
  startMinute: Int!
  customFields: [CustomFieldInput!]
}

input CreateGroupingTemplateInput {
  slug: String!
  name: String!
  type: GroupingType!
  title: String!
  dungeonId: ID
  startsInDays: Int!
  startHour: Int!
  startMinute: Int!
  customFields: [CustomFieldInput!]
}

input SaveGroupingTemplateInput {
  groupingId: ID!
  name: String
}

type Grouping {
  id: ID!
  title: String!
  type: GroupingType!
  startsAt: String!
  dungeon: Dungeon
  seats: [Seat!]!
  occupiedCount: Int!
  readyCount: Int!  # 已就位人数 (发车提醒就位进度)
  maxSlots: Int!
  status: String!  # open / closed / draft / completed (已完成: 不进列表、不发提醒, 详情直达可打开)
  creatorDiscordId: String  # 车头 (创建者) 的 Discord id; 旧车/REST 车未记录为 null
  # 本车的自定义报名表字段 (创建者定义; 报名时成员按此填写)
  customFields: [CustomField!]!
}

# ============ 页面：组队详情 ============
# URL: /{slug}/grouping/{id}

extend type Query {
  groupingDetailPage(slug: String, id: ID!): GroupingDetailPage!
  sharedGrouping(code: String!): SharedGroupingPage!
  # Combat report page (/{slug}/car/{id}/report): the same union
  # the detail page's combatReport field resolves; gating mirrors
  # groupingDetailPage (tenant isolation + guild access), then
  # the T2 composition runs — null below T2 with the paygate OFF.
  combatReportPage(slug: String, groupingId: ID!, encounterId: ID): GroupingCombatReportResult
}

# ============ 页面：车队公开分享 ============
# URL: /s/{code} — 匿名只读面: 短链码即凭据 (与装备分享 /b/{code} 同范式)。
# 只下发 OG 卡面口径的公开字段 (标题/类型/副本/时间/人数/逐座占用);
# 成员细节 (座位昵称/流派/uid/就位/报名表答案/车头 Discord id) 一律不下发。
# 未知码 / 车已解散 / dev_only 百业 (非 dev 来源) 一律 exists=false 空壳,
# 客户端据此渲染失效态。报名等写入口不在本面: 访客经 CTA 登录后回规范车页操作。

type SharedGroupingPage {
  exists: Boolean!
  slug: String        # 百业 slug (客户端拼规范车页链接用)
  guildName: String
  title: String
  type: GroupingType
  dungeonName: String
  startsAt: String    # 与 Grouping.startsAt 同口径 (epoch 秒字符串或旧文本)
  status: String      # open / closed / draft / completed
  occupiedCount: Int!
  maxSlots: Int!
  seats: [SharedGroupingSeat!]!
  # UI 文案: 全部由本页 shell 的 gen 方法按请求 locale 生成
  shareKicker: String!
  shareLoginLabel: String!
  shareOpenLabel: String!
  shareNotFoundTitle: String!
  shareNotFoundBody: String!
  shareReadonlyHint: String!
  shareStatusOpenLabel: String!
  shareStatusClosedLabel: String!
  shareStatusCompletedLabel: String!
  sharePeopleTemplate: String!
  shareSeatsTitle: String!
