extend type Mutation {
  # 百业管理 (全部在 resolver 内复验服务器管理员结论)
  updateGuildProfile(slug: String!, input: UpdateGuildProfileInput!): GuildAdminPayload!
  updateGuildDiscord(slug: String!, input: UpdateGuildDiscordInput!): GuildAdminPayload!
  updateGuildReminderSettings(slug: String!, offsets: [Int!]!, customText: String): GuildAdminPayload!
  updateGuildWhiteLabel(slug: String!, hideBranding: Boolean!, ogAccent: String!, ogTitleSuffix: String): GuildAdminPayload!
  # Custom domain (P23, T3): admin self-service bind / verify-and-activate
  # / unbind; bind and verify re-check the manage verdict + the T3 tier
  # verdict inside the resolver, while unbind carries no tier gate
  # (downgrade semantics are freeze-not-delete, and removing one's own
  # record is always allowed).
  bindGuildCustomDomain(slug: String!, hostname: String!): GuildAdminPayload!
  verifyGuildCustomDomain(slug: String!): GuildAdminPayload!
  removeGuildCustomDomain(slug: String!): GuildAdminPayload!
  # 开通 Premium: 服务端建 Stripe Checkout Session 并回带托管页
  # URL。总闸关 / 已开通 / Stripe 未配置时以 errors 目录文案拒绝
  # (paygateDisabled / premiumActive / premiumComingSoon)。
  # tier is the target tier (1/2/3, nullable): when given, the
  # checkout charges that tier's configured Stripe price; a tier
  # without a configured price is refused as unconfigured
  # (premiumComingSoon) and never falls back to another tier or
  # the legacy price; when absent, the legacy single-price path
  # runs, byte-identical to the pre-tier behavior.
  startPremiumCheckout(slug: String!, tier: Int): GuildAdminPayload!
  updateGuildVisibility(slug: String!, devOnly: Boolean!): GuildAdminPayload!
  # 头像以 base64 文本上传 (GraphQL 无二进制通道); 服务端解码后仍走
  # 与原直传相同的大小/魔数校验, 错误文案走 errors 目录。
  setGuildAvatar(slug: String!, dataBase64: String!): GuildAdminPayload!
  deleteGuildAvatar(slug: String!): GuildAdminPayload!
  createAdminEvent(slug: String!, input: CreateAdminEventInput!): GuildAdminPayload!
  updateAdminEvent(slug: String!, eventId: ID!, input: UpdateAdminEventInput!): GuildAdminPayload!
  deleteAdminEvent(slug: String!, eventId: ID!): GuildAdminPayload!
  removeEventSignup(slug: String!, signupId: ID!): GuildAdminPayload!
  addEventResult(slug: String!, eventId: ID!, input: AddEventResultInput!): GuildAdminPayload!
  deleteEventResult(slug: String!, resultId: ID!): GuildAdminPayload!
  updateSchoolGuide(slug: String!, input: UpdateSchoolGuideInput!): GuildAdminPayload!
  # 活动工具 (免费, 不挂权益门; 全部在 resolver 内复验管理结论)
  createLottery(slug: String!, input: CreateLotteryInput!): GuildAdminPayload!  # 名单创建时定格
  drawLottery(slug: String!, lotteryId: ID!): GuildAdminPayload!  # 按权重不重复抽取, 结果留痕
  # 赛季前检查: 勾选/取消一个条目 (键必须是当前赛季清单的真实条目键)
  setSeasonChecklistItem(slug: String!, itemKey: String!, checked: Boolean!): GuildAdminPayload!
  # 名册截图 OCR: 客户端识别出的文本行送后端分类, 生成待确认预览
  # 批次。计量与装备批量 OCR 共用同一日计数 (usage_counters 的
  # gear_ocr_batches) 与同一限额: 单批张数 + 每日批次, 不新开通道。
  previewRosterImport(slug: String!, lines: [String!]!, imageCount: Int!): RosterImportPayload!
  # 确认导入: 仅 rowIds 里 NEW 状态的行落为名册条目; 批次随即关闭。
  confirmRosterImport(slug: String!, batchId: ID!, rowIds: [ID!]!): RosterImportPayload!
  deleteGuildRosterEntry(slug: String!, entryId: ID!): GuildAdminPayload!
  # 招新线 (免费, 不挂权益门; 全部在 resolver 内复验管理结论)
  updateGuildRecruitOpen(slug: String!, open: Boolean!): GuildAdminPayload!  # 招新开关: 开 = 进主页目录 + 可申请; 关 = 下目录 + 新申请以 recruitClosed 拒绝
  sendTargetedNudge(slug: String!, eventId: ID!, segmentKind: String!, segmentValue: String): OpsPayload!
  executeSeasonRollover(slug: String!): OpsPayload!
  updateContributionRule(slug: String!, actionKey: String!, points: Int!, enabled: Boolean!): OpsPayload!
  reviewGuildApplication(slug: String!, applicationId: ID!, approve: Boolean!): GuildAdminPayload!  # 通过 = 结案 + 登记名册 (Discord 入服由申请人自行完成, 见 recruit 文案)
  setGuildMentor(slug: String!, discordId: String!, isMentor: Boolean!): GuildAdminPayload!  # 设/取消导师人选 (不改已有配对)
  createMentorPairing(slug: String!, mentorDiscordId: String!, menteeDiscordId: String!): GuildAdminPayload!  # 导师须已在人选中; 新人同时至多一段进行中配对
  endMentorPairing(slug: String!, pairingId: ID!): GuildAdminPayload!  # 结束留痕, 不删行
  # Insights P9 readiness-line write path (Premium T1): the
  # resolver re-checks the admin verdict plus tierLocked(1);
  # below tier it refuses with premiumRequired, and stored lines
  # are frozen, never deleted, across expiry / downgrade. An empty
  # id creates a new line; another guild's id counts as not found.
  upsertGearStandard(slug: String!, id: ID, label: String!, minScore: Int!): GearStandardPayload!
  deleteGearStandard(slug: String!, id: ID!): GearStandardPayload!
}

extend type Mutation {
  # 入业申请 (F16): 登录的非成员向已绑定且开启招新的百业提交;
  # 未开启时以 recruitClosed 拒绝; 已有待审申请时以
  # applicationPending 拒绝 (仓储部分唯一索引同规兜底)。
  applyToGuild(slug: String!, message: String): RecruitPayload!
}

extend type Mutation {
  # -- P19 fill market --
  # Supply side (free): a member of this guild publishes their own fill offer; one open offer per person.
  publishFillOffer(slug: String!, school: String!, windows: [AvailabilitySlotInput!]!, note: String): FillOfferPayload!
  # Supply side (free): withdraw one's own offer.
  withdrawFillOffer: NetworkOkPayload!
  # Demand side (T3): the grouping's leader / this guild's admin posts a fill request against a concrete grouping gap.
  createFillRequest(slug: String!, groupingId: ID!, neededRole: String!, neededSchool: String, note: String): FillRequestPayload!
  # Demand side (T3): close a request (its remaining pending invites expire with it).
  closeFillRequest(slug: String!, requestId: ID!): NetworkOkPayload!
  # Demand side (T3): invite one offer's supplier.
  inviteFillSupplier(slug: String!, requestId: ID!, offerId: ID!): FillInvitePayload!
  # Supply side (free): the supplier accepts / declines an invite. Accepting only matches; it never seats.
  respondFillInvite(inviteId: ID!, accept: Boolean!): FillInvitePayload!
  # Demand side (T3): manual seating -- the leader seats the
  # accepted supplier into the grouping (the existing
  # capacity-guard seat action; never fires automatically).
  seatFillSupplier(slug: String!, inviteId: ID!): NetworkOkPayload!
  # -- P20 allied guilds --
  # This guild's admin invites another guild into an alliance.
  inviteAlliance(slug: String!, targetSlug: String!): AlliancePayload!
  # The invited guild's admin accepts / rejects the alliance.
  respondAlliance(slug: String!, allianceId: ID!, accept: Boolean!): AlliancePayload!
  # Either side's admin dissolves the alliance unilaterally (sharing stops at read time, immediately).
  endAlliance(slug: String!, allianceId: ID!): AlliancePayload!
  # The leader / this guild's admin sets this grouping's ally sharing (visibility + visitor slots).
  setGroupingAllySharing(slug: String!, groupingId: ID!, allyVisible: Boolean!, visitorSlots: Int!): NetworkOkPayload!
  # An ally member signs up for a visitor seat (slug = the
  # signer's own guild; the server re-verifies the current
  # alliance state / sharing switch / visitor quota and uses the
  # existing capacity guard).
  joinAllyGrouping(slug: String!, groupingId: ID!, weapon: String!): NetworkOkPayload!
}

# ============ OG 卡面数据通道 (公开, 只读) ============
# OG worker 专用窄通道, 替代原 REST 三读 (/api/tenants、本周车表、
# 车详情)。只暴露卡面本来就公开的字段: 百业名/标语对匿名公开是产品
# 裁决 (2026-10-25); 车卡字段与原 REST 详情的卡面子集逐一对应, 绝不
# 含成员昵称等报名明细。dev_only 百业从非 dev 来源看不存在 (同全站规矩)。

type OgGuildCard {
  exists: Boolean!
  name: String!
  slogan: String!
  # 本周 (周一 05:00 北京边界) 招募中的双十车数, 口径与原 REST 周表
  # 计数完全一致 (activity 且 status 不在 draft/completed)。
  weekActivityCount(fromUtc: Int!, toUtc: Int!): Int!
  # 白标分享卡定制: 已解析的强调色色值 (空 = 未定制, OG worker 用
  # 默认模板渲染, 与定制前逐字节一致) 与标题后缀 (空 = 无后缀)。
  # 只下发色板校验后的值, 永不下发管理员原始输入。
  ogAccentColor: String!
  ogTitleSuffix: String!
  # 本周车队图的数据口: 窗口内全部 open 车 (半开区间
  # [fromUtc, toUtc), 与全站周界同口径), 按出发时间升序; 每台车
  # 只带卡面字段 (标题/类型/副本/双时区时间串/人数/车头名), 与
  # ogCarCard 同一窄口纪律。
  weekCars(fromUtc: Int!, toUtc: Int!): [OgWeekCar!]!
}

# 本周车队图上的一台车: 时间串由后端按分享面双时区口径整串渲染
# (cardTimeText, OG worker 逐字印), 车头名走身份链解析 (百业内
# 昵称优先), 与车卡字段一一对应。
type OgWeekCar {
