  polls: [TimePoll!]!
  # Premium T2 best-slot advice (P6): same audience verdict as the
  # availability summary (admin / leader); Locked shell below T2 with
  # the paygate ON, full shell at tier, null below T2 with the
  # paygate OFF; with no availability data slots is empty and the
  # backend empty-state copy ships — no slot is ever invented.
  bestSlotsAdvice: SchedulingBestSlotsResult
  weekdayNames: [String!]!
  # 发车表单文案 (以投票时间发车时预填同一个建车表单, 与列表页同口径)
  formCreateTitle: String!
