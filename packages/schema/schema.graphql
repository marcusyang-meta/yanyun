  # Overview summary lines (composed by the backend from the
  # stored snapshot, per locale)
  overviewLines: [String!]!
  modelVersionText: String!
  activityNote: String!
  rdpsNote: String!
  colPlayer: String!
  colTotal: String!
  colActivity: String!
  colDps: String!
  colRdps: String!
  colRShare: String!
  colSkill: String!
  colCasts: String!
  colHits: String!
  colAvg: String!
