  statusLabel: String!      # 状态文案 (后端按 locale 组合)
  dungeonId: Int            # 可选关联副本 (dex 副本行 id; 纯文本目标为 null)
  dungeonName: String       # 关联副本名 (后端数据, 非前端字典)
  seasonName: String        # 关联副本所属赛季名 (后端赛季表)
