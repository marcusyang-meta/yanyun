input TiaolvInput {
  innerSkills: [String!]!  # 4个心法名；"N/A" 表示空
  wuxue: String            # 武学名，如 "破竹鸢"（Excel F14）
  wuku: String             # 武库: TiaolvPage.tlWukuOptions 的 id (self/common); 旧客户端传规范名 "本系"/"通用" 亦可（Excel G9）
  attrRequire: Float       # 属性需求数值（Excel H14，默认 492）
  suit: String!            # 套装（Excel T2）: tlSuitOptions 的 id; 旧客户端传规范名如 "撼天" 亦可
  bowSkill: String         # 弓决（Excel S2）: tlBowOptions 的 id (none = 不传/null); 旧客户端传规范名 会心/精准/会意 亦可
  tunes: [TiaolvCellInput!]
}

