type GroupingDetailPage {
  grouping: Grouping!
  # Premium T2 scheduling advice (P3 draft / P4 substitutes / P5
  # rotation): non-null only for this car's managers (leader / guild
  # admin) of an entitled guild; below T2 with the paygate ON only
  # the Locked shell ships (zero advice data); below T2 with the
  # paygate OFF the field is null and the section does not exist.
  # Advice never seats or substitutes anyone by itself; applying a
  # draft goes through the existing seat actions.
  schedulingAdvice: GroupingSchedulingAdviceResult
  # 分享 URL: 本车的稳定短链 (后端懒铸造, 首次下发时生成、之后恒同);
  # 客户端分享动作只用这个字符串, 不自拼 URL。
  shareUrl: String!
  # 分享图 URL: 本车 OG 卡图 (与分享页 og:image、发车提醒 embed 同一构造);
  # 客户端「分享图」动作只用这个字符串取图, 不自拼 URL; 无百业行时为 null。
  shareImageUrl: String
  # 移动端 Bloks-lite: 本页内容区积木对象树 (同 GroupingListPage.blocks);
  # 逐座动作与解散按钮按观看者在服务端生成, 客户端不重建权限。
  blocks(blocksVersion: Int): [Block!]!
  # 管理动作对象: 仅当观看者可管理本车时存在 (车头本人, 或本百业的
  # 管理员——2026-10-26 裁决与车头同权); 否则为 null, 客户端不渲染
  # 编辑/完成/恢复/解散入口。服务端在 mutation 处独立复验。
  manageActions: GroupingManageActions
  # Ally sharing control (P20): present only when the viewer can
  # manage this grouping (same verdict as manageActions); null
  # otherwise. setGroupingAllySharing re-verifies in the mutation.
  allySharing: AllySharingControl
  # 合并车队动作对象 (免费功能): 仅当本车可被合并时存在——观看者可管理
  # 本车、本车为成员车且报名中、且非竞速车; 候选为同百业同类型报名中、
  # 且观看者同样可管理的车 (选中即并入本车, 本车为目标)。否则为 null,
  # 客户端不渲染入口。mergeGrouping 在 mutation 处独立复验全部条件。
  merge: GroupingMerge
  # 存为模板动作对象: 仅当观看者可在本百业写 (建车同权) 时存在, 否则 null;
  # 客户端据此渲染「存为模板」入口, mutation 处独立复验。
  templateSave: GroupingTemplateSave
  # 再来一车动作对象: 仅当观看者可管理本车时存在 (车头 / 本百业管理员),
  # 否则 null; 默认出发时刻由服务端按观看者时区算好, mutation 处独立复验。
  cloneAction: GroupingCloneAction
  # 催报名动作对象: 仅当观看者可管理本车时存在 (车头 / 本百业管理员),
  # 否则 null; 文案由服务端按名册减去本车已报名 (以座位上的身份戳
  # 判定, 与 P8 定向催报名的 'all' 段同一口径) 整段生成, 客户端只复制。
  nudgeCopy: GroupingNudgeCopy
  # 报名表答案名册: 仅可管理本车的观看者 (车头 / 本百业管理员) 得到
  # 非空值; 其他观看者为 null, 答案不下发。mutation/查询处同一判定。
  rosterAnswers: [RosterAnswer!]
  rosterAnswersTitle: String!
  # AI activity recap (Premium T3, P18): the response type IS the
  # verdict — null = this guild is below T3 with the paygate OFF
  # (the section does not exist); Locked = below T3 with the
  # paygate ON (zero recap content dispatched); NotEnabled = no AI
  # provider configured (the Workers AI binding is absent; every
  # guild incl. T3 gets this variant, nothing generates or stores);
  # Ready = a stored recap (member-visible, follows the grouping's
  # own visibility); Empty = available but not generated yet. The
  # generate action object rides only Ready/Empty and only for the
  # leader or this guild's admins.
  recap: GroupingRecapResult
  # Combat reports (premium T2): the union variant is the
  # verdict — absent resolves null (below T2 with the paygate
  # OFF: the section does not exist); Locked = below T2 with the
  # paygate ON (sales copy only, zero encounter data read);
  # Ready = stored encounters (member-visible, follows the
  # grouping's own visibility); Empty = available, none imported
  # yet. Imports arrive over HTTP (file upload); the delete
  # action object rides a summary row only for viewers who may
  # delete that encounter (uploader / leader / guild admin).
  combatReport: GroupingCombatReportResult
  # 无管理码，人人可管
  # UI 文案: 全部由本页 shell 的 gen 方法按请求 locale 生成
  detailNotFoundText: String!
