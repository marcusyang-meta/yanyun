# 抽奖参与名单来源: GROUPING = 某辆车的已落座参与者快照;
# MEMBERS = 管理员从本百业名册手选。
enum LotterySource {
  GROUPING
  MEMBERS
}

enum LotteryStatus {
  OPEN
  DRAWN
}

# 一次抽奖的留痕全貌: 奖池 (prize)、名单来源、定格名单 (含权重)、
# 中奖结果与时间都在本类型回读。
type GuildAdminLottery {
  id: ID!
  title: String!
  prize: String!
  source: LotterySource!
  sourceEventId: ID
  sourceEventTitle: String
  winnerCount: Int!
  status: LotteryStatus!
  entryCountText: String!
  createdAtText: String!
  drawnAtText: String
  entries: [GuildAdminLotteryEntry!]!
  winners: [GuildAdminLotteryEntry!]!
}

type GuildAdminLotteryEntry {
  discordId: String!
  displayName: String!
  weight: Int!
}

# 手选名单的候选行: 本百业名册 (guild_members) 的成员。
# ============ 招新新人线 (F16 / F24 / F17, 免费功能) ============
# 申请状态: PENDING 待审核 -> APPROVED 已通过 / REJECTED 未通过;
# 结案后不可改判 (仓储层 still-pending 守卫), 未通过者可重新申请。
enum RecruitApplicationStatus {
  PENDING
  APPROVED
  REJECTED
}

enum MentorPairingStatus {
  ACTIVE
  ENDED
}

# 一份入业申请的留痕全貌: 附言、状态、申请与审核时间、审核人。
# 申请人本人在招新页读自己的 (最新一份), 管理员在审核队列读全量。
type RecruitApplication {
  id: ID!
  applicantDiscordId: String!
  applicantName: String!
  message: String!
  status: RecruitApplicationStatus!
  statusLabel: String!
  createdAtText: String!
  reviewedByName: String
  reviewedAtText: String
}

# 一段导师配对: 双方名快照 + 状态 + 建立/结束时间, 全部留痕。
type MentorPairing {
  id: ID!
  mentorDiscordId: String!
  mentorName: String!
  menteeDiscordId: String!
  menteeName: String!
  status: MentorPairingStatus!
  statusLabel: String!
  createdAtText: String!
  endedAtText: String
}

# 名册行 + 导师人选标记: 管理面据此设导师、建配对 (标记只是数据,
# 写操作仍在 resolver 内复验人选资格, 前端不据标记自行放行)。
type RecruitMember {
  discordId: String!
  displayName: String!
  isMentor: Boolean!
}

type NewcomerChecklistItem {
  key: String!
  label: String!
  hint: String!
  done: Boolean!
}

# 新人入业清单 (F24): 四项全部从既有数据推导, 平台不存清单状态 —
# profile = 本百业有落座且流派非空的座位 (时区由客户端每请求呈现,
# 平台无存储型时区资料, 故该半项无需填写、永不阻塞); availability =
# 本人已在本百业填写可用时间 (个人设置中的编辑面, 可跳过、永不
# 阻塞); mentor = 本人为一段进行中配对的新人; firstRun = 在已完
# 成的车队中落座。
type NewcomerChecklist {
  items: [NewcomerChecklistItem!]!
  doneCount: Int!
  totalCount: Int!
  progressText: String!
}

# 军官侧新人总览行: 清单四项结论逐项下发 (与本人视图同一推导)。
type NewcomerProgress {
  discordId: String!
  displayName: String!
  profileDone: Boolean!
  availabilityDone: Boolean!
  mentorDone: Boolean!
  firstRunDone: Boolean!
  doneCount: Int!
  progressText: String!
}

# 平台主页招新区 (招新线 F16/F24/F17 的唯一会员面; 独立招新页已解
# 散): 目录对所有人公开, 只列已绑定服务器且开启招新
# (tenants.recruit_open) 的百业 (名称/简介/头像为平台公开口径, 与
# GuildCard 同集); 申请区只为登录非成员按百业拼装; 新人拼装只为
# 成员 (清单) 与被配对者 (配对) 拼装, 不看招新开关。匿名两区皆
