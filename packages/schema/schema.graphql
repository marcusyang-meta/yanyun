# 燕云百业工具 v2 GraphQL Schema
# 按页面组织，非对象导向
# 当期 = version 字段匹配当前版本（如 intl-v2.3），无 isCurrent 布尔值
# 实体命名：Grouping（组队），非 Car

# ============ 枚举 ============

enum GroupingTab {
  ACTIVITY  # 双十人本
  TALENT    # 天赋组队
  RACE      # 竞速报名
  TOWER     # 爬塔
}

enum GroupingType {
  ACTIVITY
  TALENT
  RACE
  TOWER
}

enum DexTab {
  MECHANICS  # 机制
  TALENTS    # 天赋
  SHOUTS     # 喊话
}

# ============ 通用类型 ============

type Seat {
  index: Int!
  nickname: String
  weapon: String  # 流派，如 破竹·樽
  role: String    # 输出 / 奶（服务端按流派推导）
  uid: String
  occupied: Boolean!
  ready: Boolean!  # 就位标记 (发车提醒用): 落座成员已确认就位
  mine: Boolean!   # 本座是否为当前观看者本人的座位 (身份戳比对, 服务端判定)
}

type Dungeon {
  id: ID!
  name: String!
  sealText: String!     # 印章短字 (个别副本有专属二字, 其余取规范名前二字; 后端按规范名计算, 与 locale 无关)
  version: String!      # 如 intl-v2.3
  playerCount: Int!     # 10人 / 5人
  size: Int!            # 同 playerCount (D1 dungeons.size), 供发车表单按副本定人数
  season: String        # 赛季码 S1..S5 (后端 dex 迁移写入, 未分类为 null)
  seasonName: String    # 赛季展示名 (后端赛季表: S1 出鞘之刃 / S2 Rewind / S3 Seek Within / S4 Forge Ahead / S5 Ever Aflame)
  category: String      # 游戏内分类 (试锋 / 梦洄 / 鉴心 / 铸矩 / 传薪), 与赛季等级档一一对应
  level: Int            # 副本等级档 (51/56/61/66/71/81/86/91/96/100)
  bosses: [Boss!]!
}

type Boss {
  id: ID!
  name: String!
  dungeon: Dungeon!
  mechanics: [Mechanic!]!  # 结构化机制
  talents: [Talent!]!      # 1-x / 2-x 天赋
  shouts: [Shout!]!        # 喊话宏
}

type Mechanic {
  phase: String!        # 如 "P1", "P2", "P3"
  title: String!
  description: String!  # 中文
}

type Talent {
  code: String!         # 如 "1-1", "2-3"
  description: String!  # 中文，视频确认标注
  verified: Boolean!    # 是否视频确认
}

type Shout {
  text: String!         # 喊话内容
  copyable: Boolean!
}

# ============ 页面：百业集结 Hub ============
# URL: /

type Query {
  hubPage: HubPage!
}

type HubPage {
  guilds: [GuildCard!]!
}

# ============ 页面：法律页 (服务条款 / 隐私政策) ============
# URL: /terms 与 /privacy — 公开页面, 匿名可达 (登录页页脚入口)。
# 正文由 LegalPageShell 的 gen 方法按 locale 从后端文案目录生成
# (zh-CN 源文 + en 全译, 其余语言逐字段回退源文), 前端不打包正文。

enum LegalKind {
  TERMS
  PRIVACY
}

extend type Query {
  legalPage(kind: LegalKind!): LegalPage!
}

type LegalPage {
  kind: LegalKind!
  title: String!
  updatedText: String!
  backLabel: String!
  sections: [LegalSection!]!
}

type LegalSection {
  heading: String!
  body: String!
}

type GuildCard {
  slug: String!
  name: String!
  slogan: String
  gameVersion: String!
  memberCount: Int!
  avatarUrl: String
}

# ============ 页面：公会主页 ============
# URL: /{slug}

extend type Query {
  guildPage(slug: String!): GuildPage!
  targetedNudgePreview(slug: String!, eventId: ID!, segmentKind: String!, segmentValue: String): TargetedNudgePreviewResult
  myContribution(slug: String!): MyContributionResult!
}

type GuildPage {
  slug: String!
  name: String!
  gameVersion: String!
  currentVersion: String!
  tabs: [String!]!  # ["双十人本", "天赋组队", "竞速报名", "攻略", "流派攻略"]
}

# ============ 移动端 Bloks-lite: 带类型积木对象 ============
# 内容区不是 JSON blob: 每个积木是一个带类型的 GraphQL object, 容器带
# children, 前端以 Relay fragment 递归渲染直到叶子 (basic element)。
# 服务端组合什么对象就是权限与分发决定本身: 车头的树里才有解散按钮
# 对象, 本人座位才有离队动作对象, 客户端零权限分支。

# Relay server 3D (@module) 协议标量: js 字段的返回值是不透明引用,
# 服务端把 module 参数原样回传, 客户端据此经 operationLoader /
# MatchContainer loader 解析出拆分操作与渲染组件。
scalar JSDependency

interface Block {
  children: [Block!]!
  # server 3D: 每个具体积木经此字段回传 @module 选中的组件/操作引用。
  js(module: String!, id: String): JSDependency
}

# 容器积木: 分区 (可选标题 + 子积木), 递归在此继续
type SectionBlock implements Block {
  title: String
  children: [Block!]!
  js(module: String!, id: String): JSDependency
}

type SectionHeaderBlock implements Block {
  text: String!
  children: [Block!]!
  js(module: String!, id: String): JSDependency
}

type TextBlock implements Block {
  text: String!
  variant: String! # title | meta | muted | body
  children: [Block!]!
  js(module: String!, id: String): JSDependency
}

type BannerBlock implements Block {
  text: String!
  children: [Block!]!
  js(module: String!, id: String): JSDependency
}

type ChipRowBlock implements Block {
  chips: [String!]!
  children: [Block!]!
  js(module: String!, id: String): JSDependency
}

type GroupingCardBlock implements Block {
  groupingId: ID!
  title: String!
  badgeText: String!
  timeText: String!
  dungeonName: String
  peopleText: String!
  statusText: String!
  action: Action
  children: [Block!]!
  js(module: String!, id: String): JSDependency
}

type SeatGridBlock implements Block {
  seats: [SeatEntry!]!
  children: [Block!]!
  js(module: String!, id: String): JSDependency
}

# 座位条目 (数据叶子, 非积木): 动作对象按观看者在服务端生成
type SeatEntry {
  index: Int!
  occupied: Boolean!
  nickname: String
  weapon: String
  role: String
  healer: Boolean!
  isLeader: Boolean!
  ready: Boolean!  # 就位标记 (发车提醒用)
  readyAction: Action  # 就位切换动作: 仅本人座位且车未完成/未出发时下发
  action: Action
}

type ActionButtonBlock implements Block {
  label: String!
  style: String! # primary | ghost | danger
  action: Action
  children: [Block!]!
  js(module: String!, id: String): JSDependency
}

type EmptyStateBlock implements Block {
  text: String!
  children: [Block!]!
  js(module: String!, id: String): JSDependency
}

type SpacerBlock implements Block {
  size: Int!
  children: [Block!]!
  js(module: String!, id: String): JSDependency
}

# 版本兜底: 客户端 blocksVersion 低于某积木所需版本时, 服务端以此对象
# 替代下发 (最老的客户端也能把它渲染成一条提示), 绝不下发未知类型。
type FallbackBlock implements Block {
  text: String!
  children: [Block!]!
  js(module: String!, id: String): JSDependency
}

# ---------- 动作 (带类型对象; 客户端按类型映射到已知 mutation/导航) ----------
interface Action {
  actionType: String!
}

type NavigateAction implements Action {
  actionType: String!
  slug: String!
  groupingId: ID!
  name: String!
  nick: String!
}

type JoinAction implements Action {
  actionType: String!
  groupingId: ID!
  seatIndex: Int!
}

type LeaveAction implements Action {
  actionType: String!
  groupingId: ID!
  uid: String!
  confirmTitle: String!
  confirmMessage: String!
  okLabel: String!
  cancelLabel: String!
}

type DisbandAction implements Action {
  actionType: String!
  groupingId: ID!
  confirmTitle: String!
  confirmMessage: String!
  okLabel: String!
  cancelLabel: String!
}

# 编辑车队动作 (词汇 v3): 只有车头的详情树里才有挂它的按钮对象,
# 与 DisbandAction 同一条服务端组合规则; 点开后宿主打开编辑表单,
# 保存走 updateGrouping (服务端再验车头)。
type EditAction implements Action {
  actionType: String!
  groupingId: ID!
}

# 完成车队动作 (词汇 v4): 与 DisbandAction 同形 (确认文案走动作对象);
# 只有车头且车未完成时详情树才下发, 落地走 completeGrouping (服务端再验)。
type CompleteAction implements Action {
  actionType: String!
  groupingId: ID!
  confirmTitle: String!
  confirmMessage: String!
  okLabel: String!
  cancelLabel: String!
}

# 恢复车队动作 (词汇 v4): 撤销完成, 无确认字段 (恢复可逆、低风险);
# 只有车头且车已完成时详情树才下发, 落地走 reopenGrouping (服务端再验)。
type UncompleteAction implements Action {
  actionType: String!
  groupingId: ID!
}

# 就位切换动作: 只有座位本人 (身份戳命中) 且车为 open/closed 时,
# 随 SeatEntry.readyAction 下发; ready 为点击后要设置的目标状态;
# 落地走 setSeatReady (服务端按身份戳再验)。
type SetReadyAction implements Action {
  actionType: String!
  groupingId: ID!
  ready: Boolean!
}

# ============ 页面：组队列表 ============
# URL: /{slug}?tab=activity (嵌入公会主页)

extend type Query {
  groupingListPage(slug: String!, tab: GroupingTab!): GroupingListPage!
}

type GroupingListPage {
  groupings: [Grouping!]!
  # 本周车队图 (免费功能): OG 周图地址 (og.yanyun.app/og/:slug/week.png)
  # 与分享文案/落点链接, 服务端整串下发, 客户端只调用既有分享/
  # 下载路径, 不自拼 URL。入口与单车分享图并列在列表页。
  weekShareImageLabel: String!
  weekShareImageUrl: String!
  weekShareText: String!
  weekShareUrl: String!
  weekShareImageSaved: String!
  weekShareImageCopied: String!
  weekShareImageFailed: String!
  weekCopyFailedManual: String!
  # Premium T2 cross-car advice (the P13 advice layer; the multi-car
  # overview itself stays free and unchanged): non-null only for guild
  # admins / leaders in this guild; full vs Locked shell as on the
  # detail page, and null for a below-tier guild while the paygate
  # is OFF.
  crossCarAdvice: SchedulingCrossCarAdviceResult
  # 本百业共享模板 (与页签无关, 全百业一份): 建车表单据此渲染模板区
  # (列表/套用/存当前表单/改删入口); 改删判定在每个模板的 manageActions。
  groupingTemplates: [GroupingTemplate!]!
  currentVersion: String!
  # 移动端 Bloks-lite: 本页内容区积木对象树 (带类型 object, 非 JSON);
  # blocksVersion = 客户端声明的积木词汇版本, 低于某积木所需版本时服务端
