# ============ 页面：百业排期 (F5 可用时间 + F13 时间投票) ============
# URL: /{slug} 的排期页签。成员填自己的每周可用时段 (UTC 存储,
# 客户端按本地时区渲染); 汇总只下发给百业管理员与在本百业发过车
# 的车头 (其他观看者 availabilitySummary 为 null)。时间投票是多选
# 可用式投票: 成员勾选所有能参加的候选, 票数实时汇总; 发起人或
# 百业管理员可关闭。投票只产出建议, 定档仍由人点选发车。

extend type Query {
  guildSchedulePage(slug: String!): GuildSchedulePage!
}

type GuildSchedulePage {
  slug: String!
  # 本人可用时段 (UTC 周内分钟窗; 未登录/未填为 [])
