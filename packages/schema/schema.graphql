# ============ 百业公告 (沟通线 F9 / F10 / F18) ============
# 一条管道三种能力: 管理员发布公告 (F9) 或紧急集合呼叫 (F18, 同一
# 实体同一 mutation, 仅 kind 不同 — 紧急带服务端组合的紧急标记且
# 走自己更严的每日频控), 全体成员经同一 Expo 推送管线收到推送,
# 站内列表是全覆盖面 (无推送令牌者不漏); 成员打开公告即记已读
# (F10), 作者/管理员在管理变体上看每条的已读/未读回执。
# 频控走 usage counter 计量: 每百业每日普通公告 5 条 / 紧急呼叫
# 2 次 (limits 服务的 FREE_LIMITS, 理由见 limits.ts)。

enum AnnouncementKind {
  STANDARD  # 普通公告 (F9)
  URGENT    # 紧急集合呼叫 (F18)
}

type GuildAnnouncement {
  id: ID!
  kind: AnnouncementKind!
  urgent: Boolean!          # 紧急形态标记 (呈现区分; 与 kind 同源, 后端下发)
  urgentLabel: String       # 紧急标记文案 (仅紧急公告下发, 其余为 null)
  kindLabel: String!        # 类型文案 (公告 / 紧急集合, 后端按 locale 组合)
  title: String!
  body: String!
  authorName: String!       # 发布者快照名 (发布时落库, 改名不影响历史)
  authorText: String        # 「X 发布」组合文案 (无快照名为 null)
  createdAtText: String!
  viewerHasRead: Boolean    # 当前查看者本人已读态 (未登录为 null)
  # Multilingual announcements (P26): display text served in the
  # viewer's current locale — the translation when a current one
  # exists, otherwise the original (identical to title/body). The
  # original title/body always hold the as-published text.
  displayTitle: String!
  displayBody: String!
  isTranslated: Boolean!    # whether the displayed text is a translation
  contentSourceLabel: String!  # translated/original source label (server-composed by locale)
  # Translation state (composed only on the admin variant while the
  # multilingual entry is visible; otherwise always null)
  translationStatusText: String
  translations: [GuildAnnouncementTranslation!]
  # 已读回执 (F10): 只在管理变体 (GuildAdmin.announcements) 的公告上
  # 组合; 成员变体恒为 null — 回执名单不向普通成员下发。
  readCount: Int
  memberCount: Int
  readCountText: String     # 「已读 x / y」组合文案 (管理变体)
  receipts: [GuildAnnouncementReceipt!]
  # 删除文案 (管理变体使用; 确认文案已在服务端按标题组合)
  deleteLabel: String!
  deleteConfirmTitle: String!
  deleteConfirmMessage: String!
}

# Multilingual announcements (P26): one target locale's translation
# state, served with the announcement only on the admin variant
# while the entry is visible. status: PENDING / DONE / FAILED.
type GuildAnnouncementTranslation {
  locale: String!
  localeLabel: String!      # language name (server-composed in the viewer's locale)
  status: String!
  statusLabel: String!      # status copy (server-composed)
}

type GuildAnnouncementReceipt {
  discordId: ID!
  displayName: String!      # 名册口径: 昵称回退全局名
  read: Boolean!
  readAtText: String        # 已读时刻 (未读为 null)
}

type GuildAnnouncementPage {
  # 文案 (announcements 目录, 后端按请求 locale 生成; 前端零字符串)
  title: String!
  emptyText: String!
  urgentLabel: String!
  composeTitle: String!
  kindLabel: String!
  kindStandardLabel: String!
  kindUrgentLabel: String!
  titleLabel: String!
  titlePlaceholder: String!
  bodyLabel: String!
  bodyPlaceholder: String!
  postLabel: String!
  postingLabel: String!
  postedText: String!
  deleteLabel: String!
  receiptsTitle: String!
  readListLabel: String!
  unreadListLabel: String!
  pushNote: String!
  urgentNote: String!
  dailyLimitText: String    # 「今日还可发布 x 条」 (仅管理变体组合)
  # 发布能力只存在于管理变体: 成员变体 canPost 恒 false、余量恒 null,
  # 发布表单只在 canPost 时挂载; mutation 端独立复验管理判定。
  canPost: Boolean!
  standardRemaining: Int
  urgentRemaining: Int
  announcements: [GuildAnnouncement!]!
  # Multilingual entry (P26, admin variant only): entry copy is
  # served only when the guild's tier reaches T2 — a pure
  # entitlement verdict that never consults the paygate master
  # switch; below T2 everything here is
  # null/false and the surface is identical to before P26. When the
  # entry is visible but the translation provider is not
  # configured, canGenerateTranslations is false and
  # translationUnavailableText carries the not-enabled note.
  canGenerateTranslations: Boolean!
  generateTranslationsLabel: String
  generatingTranslationsLabel: String
  translationsGeneratedText: String
  translationsPartialText: String
  translationUnavailableText: String
}

type GuildAnnouncementPayload {
  ok: Boolean!
  error: String
  errorCode: String
  announcement: GuildAnnouncement
}

extend type Mutation {
  # 发布公告/紧急呼叫: 管理判定 (所绑服务器管理员, 含 omni) 复验;
  # 错误码 announcementTitleRequired / announcementTitleTooLong /
  # announcementBodyTooLong / announcementDailyLimit /
  # urgentCallDailyLimit / adminOnly / guildNotFound (文案走 errors 目录)
  postGuildAnnouncement(slug: String!, kind: AnnouncementKind!, title: String!, body: String!): GuildAnnouncementPayload!
  # 标已读: 登录成员本人, 公告按本百业解析 (跨百业 id 视为不存在);
  # 错误码 loginRequired / memberOnly / announcementNotFound / guildNotFound
  markGuildAnnouncementRead(slug: String!, announcementId: ID!): GuildAnnouncementPayload!
  # 删除公告 (连带其已读回执): 管理判定复验, 按本百业解析
  deleteGuildAnnouncement(slug: String!, announcementId: ID!): GuildAnnouncementPayload!
  # Generate the multilingual versions (P26): manual trigger
  # (translation is metered; posting never auto-translates); the
  # admin verdict is re-checked, plus the tier-at-T2 verdict;
  # provider not configured -> translationNotConfigured; a single
  # locale's failure is recorded as a failed state and never
  # affects the original or this response (ok stays true, state is
  # served on the announcement's translation fields)
  generateGuildAnnouncementTranslations(slug: String!, announcementId: ID!): GuildAnnouncementPayload!
}

# ============ 军官工具 (免费功能线 F12/F11/F19, 不挂权益门) ============
