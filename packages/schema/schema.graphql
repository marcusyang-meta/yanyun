# ============ Insights (Premium T1 data layer: P2/P9/P10/P15) ============
# All four surfaces share one below-tier variant: Premium locked
# copy only, zero data fields. The verdict is tierLocked(guild, 1),
# a pure entitlement check that ignores the paygate switch: free /
# no entitlement / expired all compose this variant, and the
# aggregation is never computed server-side.

type GuildInsightsLocked {
  premiumTitle: String!
  premiumBody: String!
}

# P2 reliability profiles: aggregated per member over all timed
# non-draft cars (a cross-period profile; P1's 4-week window does
# not apply). A signup is a seat row stamped with a discord_id
# (proxy signups credit the proxied member); attended = seated on
# a completed car with ready_at set (checked in); no-show = seated
# on a completed car but never checked in (the platform keeps no
# separate attendance register, so the ready mark is the only
# presence signal); unfinished cars count signups only and settle
# neither way. attendanceRate = attended / settled seats
# (settledCount), 0 when nothing has settled.
type GuildAdminReliability {
  entries: [ReliabilityEntry!]!
}

type ReliabilityEntry {
  discordId: String!
  displayName: String!
  signupCount: Int!
  attendedCount: Int!
  noShowCount: Int!
  settledCount: Int!
  attendanceRate: Float!
}

union GuildAdminReliabilityResult = GuildAdminReliability | GuildInsightsLocked

# P10 participation heatmap: attended participations (the P2
# attendance caliber) bucketed by car start time. The platform
# stores no per-member timezone (F4 caliber: stored in UTC,
# rendered in the viewer's timezone), so buckets use the
# requesting viewer's timezone (ctx.tz, same caliber as P1's week
# labels). weekday 0 = Monday.
type GuildAdminParticipationHeatmap {
  timezone: String!
  totalAttended: Int!
  peakCount: Int!
  totalText: String!
  weekdayLabels: [String!]!
  cells: [ParticipationHeatmapCell!]!
}

type ParticipationHeatmapCell {
  weekday: Int!
