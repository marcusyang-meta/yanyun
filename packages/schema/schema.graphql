type OgCarCard {
  title: String!
  type: String!
  startsAtUtc: Int
  startsAtText: String!
  dungeonName: String!
  occupiedCount: Int!
  maxSlots: Int!
  status: String!
  # 本车已有短链的 code (只读解析, 永不在此铸造); 从未分享过的车为
  # null, 其卡图不印二维码。OG worker 据此在卡面印短链二维码。
  shareCode: String
  # 卡面时间行 (后端按车队归属时区渲染好的整串, 如 "周日 13:30 美西");
  # OG worker 原样上卡, 与 og:description 同源同口径。无开始时间为 ""。
  cardTimeText: String!
}

# 方案分享卡: 只取卡面字段 (方案名/流派标签/毕业度快照), 永不下发
