# ============ 页面：设置 (账号级语言偏好) ============
# 文案字段直接长在 SettingsPage shell 上, 由其 gen 方法按请求 locale 生成;
# localePref = 账号存储的偏好 (null = 自动/跟随浏览器), effectiveLocale =
# 本请求实际生效 locale (偏好压过浏览器语言)。

extend type Query {
  settingsPage: SettingsPage!
}

type SettingsPage {
  settingsTitle: String!
  settingsDiscordLabel: String!
  settingsLanguageLabel: String!
  settingsLanguageHint: String!
  settingsAutoLabel: String!
  settingsLangZhCnLabel: String!
  settingsLangZhTwLabel: String!
  settingsLangEnLabel: String!
  settingsLangEsLabel: String!
  settingsLangFrLabel: String!
  settingsSavedText: String!
  # 意见反馈: 个人资料内的入口 + 表单文案 (类别枚举见 FeedbackCategory)
  feedbackEntryLabel: String!
  feedbackTitle: String!
  feedbackCategoryLabel: String!
  feedbackCategoryProblemLabel: String!
  feedbackCategorySuggestionLabel: String!
  feedbackCategoryOtherLabel: String!
  feedbackPlaceholder: String!
  feedbackSubmitLabel: String!
  feedbackSubmittingLabel: String!
  feedbackSuccessText: String!
  localePref: String
  effectiveLocale: String!
  # ---- 我的数据 (账号导出 / 删除自助) ----
  accountSectionTitle: String!
  accountExportLabel: String!
  accountExportHint: String!
  accountDeleteLabel: String!
  accountDeleteHint: String!
  accountReauthLabel: String!
  accountReauthHint: String!
  accountConfirmTitle: String!
  accountConfirmIntro: String!
  accountConsequenceCars: String!
  accountConsequenceData: String!
  accountConsequenceGuilds: String!
  accountConsequenceResidual: String!
  accountConsequenceReregister: String!
  accountExportFirstHint: String!
  accountUsernameLabel: String!
  accountSubmitLabel: String!
  accountBackLabel: String!
  accountCancelDeletionLabel: String!
  accountDeletionRequestedText: String!
  accountDeletionCancelledText: String!
  # 我的赛季目标 (F19): 成员给自己设的目标, 挂在设置语境 (设置
  # dialog 的一个 dialogPage); 目标实体与文案见 MySeasonGoalPage。
  seasonGoals: MySeasonGoalPage!
  # 最近一次完成 Discord OAuth 往返的 epoch 秒 (null = 从未); 导出与
  # 删除提交要求 10 分钟内的新鲜授权, 闸门在 mutation 服务端强制,
  # 此字段只供界面决定先展示哪一步。
  freshAuthAt: Int
  # 待删除状态只由「在场」表达: 有未到期 (或已到期待执行) 的删除
  # 申请时此对象存在, 否则为 null — 前端不拿标志位自判。
  accountPendingDeletion: AccountPendingDeletion
  # ---- 我的可用时间 (F5 编辑面归位个人设置): 文案与排期页同一组
  # schedule 目录字符串; 数据按本人所属百业逐份下发, 编辑仍走
  # setMyAvailability (同一实体、同一时区口径), 此处只是新落点。
  availabilityTitle: String!
  availabilityHint: String!
  availabilityWeekdayNames: [String!]!
  availabilityAddSlotLabel: String!
  availabilityRemoveLabel: String!
  availabilitySaveLabel: String!
  availabilitySavedText: String!
  availabilitySaveFailedTemplate: String!
  availabilityEmptyText: String!
  availabilityNoGuildsText: String!
  availabilityGuilds: [SettingsAvailabilityGuild!]!
  # ---- 日历订阅 (免费功能): 本人的 iCal 订阅链接 (token 即凭证,
  # 只读公开端点, 内容仅本人已报名的未结束车); 未登录为 null。
  # token 首次读取时惰性生成, 重置走 resetCalendarFeedToken。
  calendarFeed: CalendarFeedSettings
  # ---- Agent 授权 (agent-native): 本人通过 OAuth 授权给 Agent 的
  # 令牌授权清单; 只有元数据 (客户端名/档位/时间/前缀), 永不
  # 下发任何令牌值; 未登录为 null。
  agentGrants: AgentGrantsSettings
}

# 个人设置里的日历订阅区: 标题/说明/订阅链接 (绝对地址, 含
# token — 只下发给本人)/复制与重置的文案。resetDoneText 在重置
# 完成后由新 CalendarFeedSettings 一并回带。
type CalendarFeedSettings {
  calendarSectionTitle: String!
  calendarHintText: String!
  calendarUrl: String!
  calendarCopyLabel: String!
  calendarCopiedText: String!
  calendarResetLabel: String!
  calendarResetDoneText: String!
}

# 个人设置里的 Agent 授权区: 本人已授权的 Agent 令牌清单 (仅
# 元数据) 与吊销文案。吊销走 revokeAgentGrant, 要求 fresh-auth
# (与删除账号同档); 吊销后该授权的访问与刷新令牌立即失效。
type AgentGrantsSettings {
  agentSectionTitle: String!
  agentHintText: String!
  agentEmptyText: String!
  agentRevokeDoneText: String!
  grants: [AgentGrant!]!
}

# 一条 Agent 授权的元数据行: 客户端名/备注名/档位标签/来源
# 标签/授权与最近使用时间均为服务端组合好的展示值, 客户端不
# 自行拼装; tokenPrefix 仅令牌前缀, 不是凭证。
type AgentGrant {
  id: ID!
  clientName: String!
  name: String!
  scopesLabel: String!
  sourceLabel: String!
  tokenPrefix: String!
  createdText: String!
  lastUsedText: String!
  revokeLabel: String!
}

type RevokeAgentGrantPayload {
  ok: Boolean!
  error: String
  errorCode: String
  agentGrants: AgentGrantsSettings
}

type ResetCalendarFeedPayload {
  ok: Boolean!
  error: String
  errorCode: String
  calendarFeed: CalendarFeedSettings
}

extend type Mutation {
  # 重置本人的日历订阅 token: 旧链接立即失效, 返回带新链接的
  # 订阅区对象; 未登录 errorCode = notLoggedIn。
  resetCalendarFeedToken: ResetCalendarFeedPayload!
}

extend type Mutation {
  # 吊销本人的一条 Agent 授权: 该授权的访问与刷新令牌立即
  # 失效。要求 fresh-auth (近期重新验证, 与删除账号同档):
  # 未登录 errorCode = notLoggedIn, 未 fresh-auth =
  # accountReauthRequired, 授权不属于本人或已吊销 = notFound。
  revokeAgentGrant(id: ID!): RevokeAgentGrantPayload!
}

# 设置页里的一份可用时间: 一个本人所属百业 + 已存的 UTC 周时段。
type SettingsAvailabilityGuild {
  slug: String!
  guildName: String!
  slots: [AvailabilitySlot!]!
}

# 冷静期中的删除申请: executesAt 为执行时刻 (ISO), daysLeft 为剩余
# 整天数; 文案在服务端按 locale 组合 (pendingBody 已含执行日期)。
type AccountPendingDeletion {
  executesAt: String!
  daysLeft: Int!
  accountPendingTitle: String!
  accountPendingBody: String!
}

enum FeedbackCategory {
  PROBLEM
  SUGGESTION
  OTHER
}

type SubmitFeedbackPayload {
  ok: Boolean!
  error: String
  errorCode: String
}

extend type Mutation {
  # 站内反馈: 身份只从会话解析; 内容去空白后非空且不超过 2000 字,
  # 同一用户滚动 24 小时内上限 5 条 (错误码 feedbackEmpty /
  # feedbackTooLong / feedbackRateLimited, 文案走 errors 目录)
  submitFeedback(category: FeedbackCategory!, text: String!): SubmitFeedbackPayload!
}

type UpdateLocalePayload {
  ok: Boolean!
  error: String
  errorCode: String
  localePref: String
  effectiveLocale: String!
}

extend type Mutation {
  # locale 为 null 时清除偏好 (回自动); 有值必须是受支持 locale id
  updateMyLocale(locale: String): UpdateLocalePayload!
}

type ExportMyDataPayload {
  ok: Boolean!
  error: String
  errorCode: String
  # 导出文档全文 (JSON 字符串, user-export v1); 失败时为 null
  json: String
  filename: String
}

type AccountDeletionPayload {
  ok: Boolean!
  error: String
  errorCode: String
  # 提交成功时的执行时刻 (ISO); 撤销成功时为 null
  executesAt: String
}

extend type Mutation {
  # 导出我的数据: 需登录 + 10 分钟内的新鲜 Discord 授权; 每 24 小时
  # 至多一次 (以 account.export 审计行计数)。凭据永不进导出包。
  exportMyData: ExportMyDataPayload!
  # 提交账号删除: 需新鲜授权 + 键入本人 Discord 显示名; 进入 7 天
  # 冷静期, 到期由每日任务执行级联。
  requestAccountDeletion(typedUsername: String!): AccountDeletionPayload!
  # 撤销冷静期中的删除申请。
  cancelAccountDeletion: AccountDeletionPayload!
}

type PushTokenPayload {
  ok: Boolean!
  error: String
  errorCode: String
}

extend type Mutation {
  # App 推送令牌 (发车提醒的 Expo 通道): 身份只从会话解析, 令牌格式服务端校验
  registerPushToken(token: String!, platform: String): PushTokenPayload!
