  hour: Int!
  count: Int!
}

union GuildAdminHeatmapResult = GuildAdminParticipationHeatmap | GuildInsightsLocked

# P9 gear readiness board: a readiness line is an admin-set entity
# (guild_gear_standards; minScore = the lower bound on the best
# build graduation score, an integer percent). A member's score is
# the maximum server snapshot graduation score (the gear domain's
# snapshot.total) over all their saved builds; with no build / no
# snapshot, bestScore is null, hasBuild is false, and the gap is
# the whole line.
