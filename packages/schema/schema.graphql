}

type GuildMemberNotePayload {
  ok: Boolean!
  error: String
  errorCode: String
  note: GuildMemberNote
}

type GuildExportPayload {
  ok: Boolean!
  error: String
  errorCode: String
  json: String              # 数据包文档 (guild-export v1, JSON)
  filename: String
}

type SeasonGoalPayload {
  ok: Boolean!
  error: String
  errorCode: String
  goal: MemberSeasonGoal
}

input SeasonGoalInput {
  id: ID                    # null = 新建; 给出 = 改自己的既有目标
  slug: String!
  title: String!
  note: String
  status: SeasonGoalStatus
  dungeonId: Int            # null = 不关联副本
}

extend type Mutation {
  # F12 写备注: 管理判定复验; 目标必须是本百业名册成员;
  # 错误码 officerMemberNotFound / officerNoteBodyRequired /
  # officerNoteBodyTooLong / adminOnly / guildNotFound
  addGuildMemberNote(slug: String!, memberDiscordId: ID!, body: String!): GuildMemberNotePayload!
  # F12 改备注: 管理判定复验, 备注按本百业解析 (跨百业 id 视为不存在)
  updateGuildMemberNote(slug: String!, noteId: ID!, body: String!): GuildMemberNotePayload!
  # F12 删备注: 管理判定复验, 按本百业解析
  deleteGuildMemberNote(slug: String!, noteId: ID!): GuildMemberNotePayload!
  # F11 导出本百业数据包: 管理判定复验, 只导本百业; 动作在
  # hub_audit_log 留痕 (actor + tenant + 计数摘要)
  exportGuildDataPackage(slug: String!): GuildExportPayload!
  # F19 建/改自己的赛季目标: 成员写门 + 目标归属调用者本人;
  # 错误码 seasonGoalTitleRequired / seasonGoalTitleTooLong /
  # seasonGoalNoteTooLong / seasonGoalNotFound /
  # seasonGoalDungeonNotFound / loginRequired / memberOnly / guildNotFound
  upsertMySeasonGoal(input: SeasonGoalInput!): SeasonGoalPayload!
  # F19 删自己的赛季目标: 归属调用者本人 (他人 id 视为不存在)
  deleteMySeasonGoal(goalId: ID!): SeasonGoalPayload!
}

# ============ Governance (premium governance line P16/P17, T3) ============
# P16 fine-grained permissions: a guild admin (an admin of the
# bound Discord server) may grant a set of capabilities drawn from
# the ten real admin surfaces to roster members (officers); admins
# themselves always hold everything, and granting itself plus
# premium checkout are ungrantable. One verdict decides
# (getOfficerVerdict): the admin verdict unioned with this guild's
# grant rows. Every admin sub-surface's read composition and every
# write re-checks per capability; an officer without a capability
# receives only the empty composition on that surface, and a plain
# member never even resolves GuildAdmin (GuildAdminLocked) — the
# governance fields do not exist on the member variant at all.
# P16 officer private area: exists only inside the governance
# surface (admins + any granted officer), zero disclosure to plain
# members — the same discipline as the F12 notes.
# P17 guild audit: this guild's management actions leave a trail
# (who / when / action / target summary, never sensitive bodies),
# read back only inside the governance surface, time-descending
# and paged. The platform hub audit is untouched.
# Tier gate: both features are T3 — when tierLocked(d1, slug, 3)
# holds, the surface composes the Locked variant and writes are
# refused with governanceTierRequired; while the paygate master
# switch is off, nobody is locked, matching the platform's
# standing semantics (built, not enabled).

# Capability-locked variant: the composition a granted officer
# gets on an admin sub-surface outside their grant (currently on
# the stats result union) — locked copy only, zero business data.
type GuildAdminSectionLocked {
  lockedTitle: String!
  lockedBody: String!
}

union GuildGovernanceResult = GuildGovernancePage | GuildGovernanceLocked

type GuildGovernanceLocked {
  lockedTitle: String!
  lockedBody: String!
}

# A grantable capability option: the key is a code token; the
# label is backend-issued per locale.
type GuildCapabilityOption {
  key: String!
  label: String!
}

# One grant row: the granted member + capability key set +
# granter snapshot.
type GuildOfficerGrant {
  discordId: ID!
  displayName: String!
  capabilities: [String!]!
  capabilityLabels: [String!]!
  grantedByName: String!
  grantedByText: String
  grantedAtText: String!
  updatedAtText: String!
}

# A roster row for the grant form: the member's current grant
# plus an admin marker (admins hold everything by verdict and
# never appear as grant rows; the marker is list presentation
# only).
type GuildGovernanceRosterMember {
  discordId: ID!
  displayName: String!
  isAdmin: Boolean!
  capabilities: [String!]!
}

# One private-board post: the body appears only inside the
# governance surface.
type GuildOfficerBoardPost {
  id: ID!
  body: String!
  authorName: String!
  authorText: String
  mine: Boolean!
  # The delete verdict (author or guild admin) is composed and
  # issued by the backend; clients never derive it.
  canDelete: Boolean!
  createdAtText: String!
}

# One audit event: the action label is backend-composed per
# locale; targetLabel is a target-summary snapshot (a title, a
# member name), never the body of a note / announcement /
# application.
type GuildAuditEvent {
  id: ID!
  actorName: String!
  action: String!
  actionLabel: String!
  targetType: String!
  targetId: String!
  targetLabel: String!
  createdAtText: String!
}

type GuildGovernancePage {
  # Copy (governance section, backend-generated per request
  # locale; zero client-side strings)
  title: String!
  hint: String!
  officersTitle: String!
  officersHint: String!
  officersEmptyText: String!
  grantMemberLabel: String!
  grantCapabilitiesLabel: String!
  grantButtonLabel: String!
  revokeButtonLabel: String!
  adminBadgeText: String!
  boardTitle: String!
  boardHint: String!
  boardEmptyText: String!
  boardPlaceholder: String!
  boardPostButtonLabel: String!
  boardDeleteButtonLabel: String!
  auditTitle: String!
  auditHint: String!
  auditEmptyText: String!
  auditLoadMoreButtonLabel: String!
  # The grant-management area is issued only to guild admins
  # (rows exist only when canManageGrants holds): officers can
  # see the board and the audit log, but the grant list and form
  # are admin-only — without the right, officers /
  # capabilityOptions / roster are all empty lists.
  canManageGrants: Boolean!
  officers: [GuildOfficerGrant!]!
  capabilityOptions: [GuildCapabilityOption!]!
  roster: [GuildGovernanceRosterMember!]!
  boardPosts: [GuildOfficerBoardPost!]!
  auditEvents(limit: Int, offset: Int): [GuildAuditEvent!]!
  auditTotalCount: Int!
}

type GuildGovernancePayload {
  ok: Boolean!
  error: String
  errorCode: String
  id: ID
}

extend type Mutation {
  # P16 grant / re-grant: guild admins only (granting is
  # ungrantable); the target must be a roster member of this
  # guild; capability keys accept code tokens only (unknown keys
  # ignored); an empty set = revoke. The T3 tier gate re-runs.
  # Error codes governanceTierRequired / officerTargetNotFound /
  # adminOnly / guildNotFound
  setOfficerGrant(slug: String!, memberDiscordId: ID!, capabilities: [String!]!): GuildGovernancePayload!
  # P16 revoke a grant: guild admins only, resolved against
  # this guild.
  revokeOfficerGrant(slug: String!, memberDiscordId: ID!): GuildGovernancePayload!
  # P16 board post: officer verdict (admin or any granted
  # officer) + the T3 tier gate. Error codes
  # officerBoardBodyRequired / officerBoardBodyTooLong /
  # governanceTierRequired / adminOnly / guildNotFound
  postOfficerBoardMessage(slug: String!, body: String!): GuildGovernancePayload!
  # P16 delete a board post: the author or a guild admin,
  # resolved against this guild. Error codes
  # officerBoardPostNotFound / adminOnly / guildNotFound
  deleteOfficerBoardPost(slug: String!, postId: ID!): GuildGovernancePayload!
}

# ============ 登录 / Viewer 层级 (root = user) ============
# 结构: Query.viewer -> guilds / guild(slug) -> groupings 等页面数据
# 权限不用状态标志表达 (flag 可 forge), 用「有没有数据」表达:
#   成员 -> Guild (完整数据, 写入口只存在于该类型的组件里)
#   未绑定 / 非成员 / 不存在 -> guild 字段为 null, 不下发任何百业数据。
# 没数据 = 没能力。mutation 在 resolver 内独立复验。

type DiscordUser {
  discordId: String!
  name: String!
  avatar: String
}

# 当前用户有管理权限 (Administrator/ManageGuild/服主) 的 Discord 服务器。
# 服务端已过滤: 下发的每一台都可用于建业/绑定, 不下发权限位给前端判断。
type DiscordServer {
  id: String!
  name: String!
  icon: String
}

# 百业成员名册条目 (代报名选人用): 名字口径与服务端落座一致
# (名册昵称, 回退全局名); globalName 供选择器在昵称重名时消歧。
type GuildRosterMember {
  discordId: ID!
  displayName: String!
  globalName: String
}

# 已绑定服务器 + 当前用户是成员: 完整数据
type Guild {
  slug: String!
  name: String
  slogan: String
  gameVersion: String!
  memberCount: Int!
  # 百业自定义头像 (管理员上传) 的版本化公开 URL; 无头像为 null。
  # 公开品牌图 (仅成员面下发; 非成员拿不到本类型)。
  avatarUrl: String
  groupings(tab: GroupingTab!): GroupingListPage!
  viewerNick: String
  # 成员名册: 仅 Guild 面声明 (非成员无从查询本类型) —
  # 字段, 权限由响应类型本身表达 (不下发任何权限标志位)。
  memberRoster: [GuildRosterMember!]!
  # 百业公告 (沟通线 F9/F10/F18): 成员变体 — 公告列表 + 本人已读态;
  # 发布与已读回执名单只在管理变体 (GuildAdmin.announcements)。
  announcements: GuildAnnouncementPage!
  # Member read surface for insights (Premium T1): the race season
  # board (P15, display surface) and the viewer's own gear readiness
  # status (P9, only the viewer's own verdict rows); both compose by
  # tierSurfaceState — the full variant, GuildInsightsLocked (zero
  # data, paygate ON), or null (paygate OFF: the surface does not
  # exist and no home tab is rendered for it).
  raceSeasonBoard: RaceSeasonBoardResult
  gearSelfStatus: GuildGearSelfResult
  homeInsightsRaceTitle: String!
  homeInsightsRaceEmptyText: String!
  homeInsightsRaceTeamLabel: String!
  homeInsightsRaceRunsLabel: String!
  homeInsightsRaceWinsLabel: String!
  homeInsightsRaceBestLabel: String!
  homeInsightsSelfGearTitle: String!
  homeInsightsGearScoreLabel: String!
  homeInsightsGearMinScoreLabel: String!
  # 百业主页外壳文案 (shell gen 方法按请求 locale 生成)
  homeBackToHubLabel: String!
  homeTabTeamLabel: String!
  homeTabDexLabel: String!
  homeTabSectLabel: String!
  homeTabAnnouncementsLabel: String!
  homeTabScheduleLabel: String!
  homeTabMarketLabel: String!
  # Allies tab label: null while the allies surface is absent for
  # this guild (below T3 with the paygate OFF) — the home page
  # renders no allies tab then, exactly like the admin entry
  # label below. Served in every other state.
  homeTabAlliesLabel: String
  # 管理入口文案: 仅通过管理判定 (getGuildAdminAccess, 与管理面同一
  # 口径, 含 omni) 的查看者才下发; 其余成员为 null, 主页不渲染入口 —
  # 进不去的入口不广告。可空即为此意, 勿改回 String!。
  homeAdminLabel: String
  detailNotFoundText: String!
  detailBackToListLabel: String!
  # 白标 chrome 组合 (Premium 第一梯队, 不挂 gate): 服务端按本百业的
  # 白标设置组合 — 品牌可见时返回标签带平台名、页脚声明为平台声明;
  # 隐藏品牌时返回标签为素文案、页脚声明为 null (客户端照单渲染,
  # 无任何品牌判断分支, 与 homeAdminLabel 同一组合哲学)。
  pageBackLabel: String!
  pageFooterDisclaimerText: String
}

type Viewer {
  user: DiscordUser             # 未登录为 null
  guilds: [Guild!]!             # 我可用的百业 (成员; 服务端过滤, 前端不许拉全量再筛)
  guild(slug: String!): Guild  # 仅当查看者可看 (已绑定服务器的成员) 才有值; 其余 (未绑定/非成员/不存在) 一律 null, 不下发任何百业数据
  guildAdmin(slug: String!): GuildAdminResult!  # 百业管理面: 响应类型即权限结论 (见下方 GuildAdmin)
  homeRecruit: HomeRecruitSection!  # 平台主页招新区 (F16 申请 / F24 清单 / F17 我的配对): 组成即权限结论 (见下方 HomeRecruitSection)
  fillMarket(slug: String!): FillMarketResult!  # Fill market page (P19): member page / Locked; the demand section splits further by T3 (see FillMarketPage below)
  guildAllies(slug: String!): GuildAlliesResult  # Allied guilds page (P20): member page / Locked for non-members; null for members of a below-T3 guild while the paygate is OFF (the page does not exist, and the home tab label is null with it); alliance and sharing are both read-time verdicts
  platformAdmin: PlatformAdminResult!  # 平台管理面 (超管): gate 层求值即权限结论 (见下方 PlatformAdmin); 非超管只拿到 Locked, 零管理数据
  discordServers: [DiscordServer!]!  # 我有管理权限的服务器 (服务端过滤)
  # UI 文案: 站点/登录/选择页/创建页/通用 — 全部由 Viewer shell 的 gen
  # 方法按请求 locale 生成, 未选中永不生成 (无 Strings 类型, 文案字段
  # 直接长在 shell 类型上)。
  siteTitle: String!
  siteSubtitle: String!
