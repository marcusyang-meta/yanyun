type GuildOfficerPage {
  # 文案 (officer 目录, 后端按请求 locale 生成; 前端零字符串)
  notesTitle: String!
  notesHint: String!
  notesEmptyText: String!
  memberNoNotesText: String!
  notePlaceholder: String!
  noteAddLabel: String!
  noteEditLabel: String!
  noteSaveLabel: String!
  noteDeleteLabel: String!
  exportTitle: String!
  exportHint: String!
  exportLabel: String!
  goalsTitle: String!
  goalsHint: String!
  goalsEmptyText: String!
