# 燕云十六声 百业报名小工具
# 全免费套餐: Workers(10万请求/天) + D1(500万行读/天, 10万行写/天, 5GB) + 静态资源托管
name = "yanyun"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# 对外主域名 (Custom Domain): yanyun.app 全部路径指向本 Worker;
# workers_dev 必须显式 true —— 有 routes 时默认会变 false, 会误关旧
# yanyun.tbdlab.workers.dev (迁移期双绑保留, 不跳转)。
workers_dev = true

[[routes]]
pattern = "yanyun.app"
custom_domain = true

# 静态前端: public/ 目录直接由 Cloudflare 托管
# run_worker_first = true: Worker 先接管路由(主站导航 /<slug> 多租户), 静态资源走 env.ASSETS
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# D1 数据库绑定 (上线前创建数据库后把 database_id 填进来)
[[d1_databases]]
binding = "DB"
database_name = "yanyun-signup"
database_id = "aa475d0e-8410-47eb-823b-0ddd346733e8"

# SeatHub 广播中枢 (Durable Object): 每个活动一个实例, WS 推送 seat 变化
[[durable_objects.bindings]]
name = "SEAT_HUB"
class_name = "SeatHub"

# GuildHub 实时推送中枢 (Durable Object): 每个百业一个实例, WS 推送车队变化
[[durable_objects.bindings]]
name = "GUILD_HUB"
class_name = "GuildHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SeatHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GuildHub"]

# 本地开发用 D1 本地实例, 变量示例(上线用 wrangler secret put 设置):
# [vars]
# ADMIN_PASSWORD = "dev-only-change-me"   # 仅本地调试用! 线上务必用 secret

# ===== Previews (wrangler preview) =====
[[previews.durable_objects.bindings]]
name = "SEAT_HUB"
class_name = "SeatHub"

[[previews.durable_objects.bindings]]
name = "GUILD_HUB"
class_name = "GuildHub"

# D1: 官方语义按 database_id 绑定 —— 同 id 即共享行数据, 隔离必须绑另一个库。
# 本账号 token 无 D1 API 权限 (d1 list 报 10000, 且 preview 部署强制要求
# database_id, 无自动配给), 建不了隔离 staging 库; 故 Preview 绑同一生产库,
# 验收纪律为匿名只读浏览 (不登录、不提交 mutation): 匿名查询全是读, WS 在
# worker 层先验会话 (匿名 403, 进不到 DO), DO 本身由平台按 Preview 自动隔离
# namespace/存储, Cron 不在 Preview 运行 —— 生产数据与提醒链零写入。
[[previews.d1_databases]]
binding = "DB"
database_name = "yanyun-signup"
database_id = "aa475d0e-8410-47eb-823b-0ddd346733e8"
