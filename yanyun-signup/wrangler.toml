# 燕云十六声 百业报名小工具
# 全免费套餐: Workers(10万请求/天) + D1(500万行读/天, 10万行写/天, 5GB) + 静态资源托管
name = "yanyun"
main = "src/worker.ts"
compatibility_date = "2025-06-01"
# nodejs_compat: the Statsig server SDK (platform gates,
# docs/STATSIG.md) imports Node builtins (zlib & friends) that
# esbuild follows through the wrapper's dynamic import — without
# this flag the bundle does not build. The flag is additive
# (Node API surface on top of the Workers runtime).
compatibility_flags = ["nodejs_compat"]

# 对外主域名 (Custom Domain): yanyun.app 全部路径指向本 Worker;
# workers_dev 必须显式 true —— 有 routes 时默认会变 false, 会误关旧
# yanyun.tbdlab.workers.dev (迁移期双绑保留, 不跳转)。
workers_dev = true

[[routes]]
pattern = "yanyun.app"
custom_domain = true

# Platform subdomains (white-label tier A): {slug}.yanyun.app reaches
# this worker; the host gate in worker.ts resolves only guilds that
# opted in (404 otherwise). og.yanyun.app stays on its own custom
# domain (more specific than this wildcard). Requires the proxied
# wildcard DNS record for *.yanyun.app to exist in the zone.
[[routes]]
pattern = "*.yanyun.app/*"
zone_name = "yanyun.app"

# 静态前端: public/ 目录直接由 Cloudflare 托管
# run_worker_first = true: Worker 先接管路由(主站导航 /<slug> 多租户), 静态资源走 env.ASSETS
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# D1 数据库绑定 (上线前创建数据库后把 database_id 填进来)
# migrations_dir: 结构变更的唯一通道 (wrangler 迁移链, 见 migrations/
# 与仓根 README 的迁移规矩); backend-deploy 在 promote 前对生产执行
# wrangler d1 migrations apply, PR/preview 阶段绝不对远程库 apply。
[[d1_databases]]
binding = "DB"
database_name = "yanyun-signup"
database_id = "aa475d0e-8410-47eb-823b-0ddd346733e8"
migrations_dir = "migrations"

# 备份快照 (R2, 私有桶): 每日定时导出全量实体数据, 保留最近 14 份;
# 桶 yanyun-backups 已于 2026-10-26 经 API 创建 (R2 在本账户已开通)。
# 备份文件含 refresh token / 密码哈希 / webhook 等机密, 严禁公开访问,
# 只经 hub 超管鉴权的 /api/hub/backup/* 路径读写。
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "yanyun-backups"

# Workers AI (premium P26 多语公告翻译, platform/translator.ts):
# m2m100 经 AI binding 调用, 无外部账号/密钥。免费额度 10,000
# neurons/天 (m2m100 计 31,050 neurons / M 输入与输出 tokens,
# 单条公告全量生成约 60 neurons); 超额调用直接失败并按 locale
# 记失败行——未经 marcus 点头不许为此开 Workers Paid。
[ai]
binding = "AI"

# Statsig Config Sync target (platform gates, docs/STATSIG.md): the
# namespace "yanyun-statsig" does not exist yet — creating it needs
# an account-side action the deploy token cannot reach (no KV
# permission). Create it in the dashboard (Storage & Databases →
# Workers KV), then uncomment with the real id in the phase-two PR.
# Until then STATSIG_KV stays unbound and every gate verdict falls
# back to the local computation (launch-day behavior, by design).
# [[kv_namespaces]]
# binding = "STATSIG_KV"
# id = "<namespace id of yanyun-statsig>"

# 定时备份: 每日 18:23 UTC (北京 02:23, 避开整点与业务高峰)
[triggers]
crons = ["23 18 * * *"]

# SeatHub 广播中枢 (Durable Object): 每个活动一个实例, WS 推送 seat 变化
[[durable_objects.bindings]]
name = "SEAT_HUB"
class_name = "SeatHub"

# GuildHub 实时推送中枢 (Durable Object): 每个百业一个实例, WS 推送车队变化
[[durable_objects.bindings]]
name = "GUILD_HUB"
class_name = "GuildHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SeatHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GuildHub"]

# 本地开发用 D1 本地实例, 变量示例(上线用 wrangler secret put 设置):
# [vars]
# ADMIN_PASSWORD = "dev-only-change-me"   # 仅本地调试用! 线上务必用 secret

# ===== Previews (wrangler preview) =====
[[previews.durable_objects.bindings]]
name = "SEAT_HUB"
class_name = "SeatHub"

[[previews.durable_objects.bindings]]
name = "GUILD_HUB"
class_name = "GuildHub"

# D1: 官方语义按 database_id 绑定 —— 同 id 即共享行数据, 隔离必须绑另一个库。
# (历史注记: token 曾无 D1 API 权限、建不了隔离 staging 库; 2026-10-27 起
# token 已有 D1 Edit —— 迁移治理路线 A 所需 —— 但 Preview 仍绑同一生产库,
# 验收纪律为匿名只读浏览 (不登录、不提交 mutation): 匿名查询全是读, WS 在
# worker 层先验会话 (匿名 403, 进不到 DO), DO 本身由平台按 Preview 自动隔离
# namespace/存储, Cron 不在 Preview 运行 —— 生产数据与提醒链零写入。
[[previews.d1_databases]]
binding = "DB"
database_name = "yanyun-signup"
database_id = "aa475d0e-8410-47eb-823b-0ddd346733e8"
