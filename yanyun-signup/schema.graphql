type GearItemPayload {
  ok: Boolean!
  item: GearItem
  error: String
  errorCode: String
}

type GearOkPayload {
  ok: Boolean!
  error: String
  errorCode: String
}

type GearImportResult {
  ok: Boolean!
  items: [GearItem!]!
  autoSelect: [GearLoadoutEntry!]!
  error: String
  errorCode: String
}

input GearBuildSaveInput {
  name: String!
  targetIdx: Int!
  loadout: [GearLoadoutEntryInput!]
  baseValues: [GearBaseValueInput!]
  xinfa: [String!]
  res: Float
  extraAcc: Float
  extraCrit: Float
  extraInt: Float
  bowKind: String
  gradDingyinOn: Boolean
}

type GearBuildPayload {
  ok: Boolean!
  build: GearSavedBuild
  error: String
  errorCode: String
}

extend type Mutation {
  addGearItem(input: GearItemCreateInput!): GearItemPayload!
  updateGearItem(id: Int!, input: GearItemCreateInput!): GearItemPayload!
  deleteGearItem(id: Int!): GearOkPayload!
  # 批量导入 (文件导入/粘贴导入/OCR 批量共用); autoSelect 按传入的当前搭配
  # 复刻原站「导入后自动选入空位」: 武器先主后副, 其余取空位。
  importGearItems(items: [GearItemCreateInput!]!, loadout: [GearLoadoutEntryInput!]): GearImportResult!
  saveGearBuild(input: GearBuildSaveInput!): GearBuildPayload!
  deleteGearBuild(id: Int!): GearOkPayload!
}
