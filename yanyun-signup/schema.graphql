# URL: /{slug}?tab=activity (嵌入公会主页)

extend type Query {
  groupingListPage(slug: String!, tab: GroupingTab!): GroupingListPage!
}

type GroupingListPage {
  groupings: [Grouping!]!
  currentVersion: String!
  # 移动端 Bloks-lite: 本页内容区积木对象树 (带类型 object, 非 JSON);
  # blocksVersion = 客户端声明的积木词汇版本, 低于某积木所需版本时服务端
  # 以 FallbackBlock 替代下发; weekOffset 相对当前周 (周界与全站同口径:
  # 周一 05:00 北京时间)。组合即权限: 观看者拿到的对象就是他能看的全部。
  blocks(blocksVersion: Int, weekOffset: Int): [Block!]!
  # UI 文案: 全部由本页 shell 的 gen 方法按请求 locale 生成 (未选中不生成)
  tabActivityLabel: String!
  tabTalentLabel: String!
  tabRaceLabel: String!
  tabTowerLabel: String!
  typeShortActivity: String!
  typeShortTalent: String!
  typeShortRace: String!
  typeShortTower: String!
  typeShortGather: String!
  typeShortExplore: String!
  prevWeekLabel: String!
  nextWeekLabel: String!
  weekHeaderTemplate: String!
  # 按日分组组头 (周框架不变, 一屏内按查看者本地自然日分组):
  # 模板含 {month}/{day}/{weekday} 占位; weekdayNames 下标 0=周日 (与
  # JS getDay 对齐), 整表按 locale 生成。移动端的组头由服务端在 Block
  # 树里拼好整句 (SectionHeaderBlock), 不经这两个字段。
  dayGroupHeaderTemplate: String!
  weekdayNames: [String!]!
  undatedGroupLabel: String!
  emptyInteractiveText: String!
  emptyReadonlyText: String!
  statusOpenLabel: String!
  peopleTemplate: String!
  newCarLabel: String!
  sealText: String!
  # 发车表单文案 (表单从列表页打开; 详情页 shell 同名同口径)
  formCreateTitle: String!
  formEditTitle: String!
  formTypeLabel: String!
  formTypeActivityLabel: String!
  formTypeTalentLabel: String!
  formTypeRaceLabel: String!
  formTypeTowerLabel: String!
  formCapacityTemplate: String!
  formHintActivity: String!
  formHintDungeonTemplate: String!
  formHintTalent: String!
  formHintRace: String!
  formHintTower: String!
  formTitleLabel: String!
  formTitlePlaceholder: String!
  formStartsLabel: String!
  formMonthTemplate: String!
  formDayTemplate: String!
  formHourTemplate: String!
  formMinuteTemplate: String!
  formDungeonLabel: String!
  formDungeonNoneLabel: String!
  formNicknameLabel: String!
  formNicknamePlaceholder: String!
  formSectLabel: String!
  formCancelLabel: String!
  formSubmitCreateLabel: String!
  formSubmitEditLabel: String!
  formSubmittingLabel: String!
  formToastSect: String!
  formToastSaved: String!
  formToastSaveFailedTemplate: String!
  formToastPosted: String!
  formToastCreateFailedTemplate: String!
  formTitleTemplate: String!
}

type Grouping {
  id: ID!
  title: String!
  type: GroupingType!
  startsAt: String!
  dungeon: Dungeon
  seats: [Seat!]!
  occupiedCount: Int!
  maxSlots: Int!
  status: String!  # open / closed / draft / completed (已完成: 不进列表、不发提醒, 详情直达可打开)
  creatorDiscordId: String  # 车头 (创建者) 的 Discord id; 旧车/REST 车未记录为 null
}

