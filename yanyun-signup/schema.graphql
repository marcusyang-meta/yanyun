  dexBackLabel: String!
  dexBossesLineTemplate: String!
  dexNoBossDataText: String!
  dexEmptyText: String!
  dexCurrentGuidesTemplate: String!
  dexCatSubTemplate: String!
  dexCatSubCurrentTemplate: String!
  dexSize10Label: String!
  dexSize5Label: String!
  dexSizeNTemplate: String!
  dexBossUnit: String!
  dexPartMechanicsLabel: String!
  dexPartShoutsLabel: String!
  dexPartTalentsLabel: String!
  dexLabelAllTemplate: String!
  dexLabelPartsTemplate: String!
  dexLabelPendingTemplate: String!
  dexLabelNoBossesText: String!
