# ============ Mutations ============

type Mutation {
  # 组队（无管理码，人人可管；唯一例外：解散仅车头可为）
  createGrouping(input: CreateGroupingInput!): GroupingPayload!
  updateGrouping(id: ID!, input: UpdateGroupingInput!): GroupingPayload!
  disbandGrouping(id: ID!): DeletePayload!  # 解散车队：仅车头（创建者）可为，服务端复验
  completeGrouping(id: ID!): GroupingPayload!  # 完成车队：仅车头可为，服务端复验；完成车不进列表、不发提醒
  reopenGrouping(id: ID!): GroupingPayload!  # 恢复车队（撤销完成，回到 open）：仅车头可为，服务端复验
  joinGrouping(input: JoinGroupingInput!): SeatPayload!
  leaveGrouping(input: LeaveGroupingInput!): SeatPayload!
  updateSeatWeapon(input: UpdateSeatWeaponInput!): SeatPayload!

  # 调律推演（服务端严格按 Excel 公式计算）
  calcTiaolv(input: TiaolvInput!): TiaolvResult!

  # 毕业率计算（6格平均，服务端计算）
  calcGraduation(input: GraduationInput!): GraduationResult!
}

# 毕业率输入：8部位，每部位6格（1主+4副+1定音）
# 口径：50%条数匹配 + 30%数值达成 + 20%三率达标（参考 gear-planner）
input GraduationInput {
  sectSlug: String!  # 流派slug，用于获取目标配方
  items: [GraduationItemInput!]!
  precision: Float  # 三率：精准
  crit: Float       # 三率：会心
  affinity: Float    # 三率：会意
}

input GraduationItemInput {
  slot: String!  # 部位：主武器/副武器/冠胄/胸甲/胫甲/腕甲/环/佩
  affixes: [AffixValueInput!]!
}

input AffixValueInput {
  key: String!      # 词条key，如 max_atk
  value: Float!     # 数值
  resonance: Boolean! # 是否承音
}

type GraduationResult {
  total: Float!           # 总毕业率 0-100
  countScore: Float!      # 条数匹配度 0-100
  valueScore: Float!      # 数值达成度 0-100
  rateScore: Float!       # 三率达标度 0-100
  items: [GraduationItemResult!]!
}

type GraduationItemResult {
  slot: String!
  score: Float!           # 单件 0-100
}

input CreateGroupingInput {
  slug: String!
  title: String!
  type: GroupingType!
  startsAt: String!
  dungeonId: ID
  seats: [SeatInput!]
}

input SeatInput {
  nickname: String!
  weapon: String!
}

input UpdateGroupingInput {
  title: String
  startsAt: String
  seats: [SeatInput!]
}

input JoinGroupingInput {
  groupingId: ID!
  # 兼容保留: 落座名字一律由服务端定 (自己报名 = 本人 Discord 服务器
  # 昵称回退全局名; 代报名 = 名册名), 客户端传值不作数。
  nickname: String!
  weapon: String!
  seatIndex: Int!
  # 代报名: 被代报成员的 Discord ID (必须在本百业名册内, 服务端复验);
  # 缺省 = 为自己报名, 座位恒落本人身份戳。
  forDiscordId: ID
}

input LeaveGroupingInput {
  groupingId: ID!
  uid: String!
}

input UpdateSeatWeaponInput {
  groupingId: ID!
  uid: String!
  weapon: String!
}

# 调律推演输入 — 严格对应 片雲 DIY 0.10.2 Excel 可编辑区
# 心法(F4:F7) 武学(F14) 武库(G9) 属性需求(H14) 套装(T2) 弓决(S2) 调律(K3:R5, K6:R24)
input TiaolvCellInput {
  cell: String!   # Excel 单元格，如 "K3", "R5", "K21"（仅 K:R 用户调律区有效）
  value: Float!
}

input TiaolvInput {
  innerSkills: [String!]!  # 4个心法名；"N/A" 表示空
  wuxue: String            # 武学名，如 "破竹鸢"（Excel F14）
  wuku: String             # "本系" | "通用"（Excel G9）
  attrRequire: Float       # 属性需求数值（Excel H14，默认 492）
  suit: String!            # 套装（Excel T2），如 "撼天"
  bowSkill: String         # 弓决（Excel S2）：会心 / 精准 / 会意
  tunes: [TiaolvCellInput!]
}

type GroupingPayload {
  ok: Boolean!
  grouping: Grouping
  error: String      # 按请求 locale 由 errorCode 在服务端生成
  errorCode: String  # 稳定错误码 (文案可变, 码不变)
}

type SeatPayload {
  ok: Boolean!
  seats: [Seat!]
  error: String
  errorCode: String
}

type DeletePayload {
  ok: Boolean!
  error: String
  errorCode: String
}

# Excel 原术语：基础白值(B列) / 面板白值(C列) / 最终面板(D列)
type TiaolvRow {
  key: String!      # 行键，如 minAtk
  label: String!    # Excel 原标签，如 最小外攻
  base: Float       # 基础白值
  panel: Float      # 面板白值（无公式的行返回 null）
  final: Float      # 最终面板
}

type TiaolvResult {
  rows: [TiaolvRow!]!
}

# ============ 登录 / Viewer 层级 (root = user) ============
# 结构: Query.viewer -> guilds / guild(slug) -> groupings 等页面数据
# 权限不用状态标志表达 (flag 可 forge), 用「响应的类型」表达:
#   成员        -> Guild        (完整数据, 写入口只存在于该类型的组件里)
#   未绑定百业  -> GuildReadOnly(公开只读数据, 无写入口)
#   非成员/不存在 -> GuildLocked (不携带任何百业内容数据)
# 前端按 __typename 分发组件; 没数据 = 没能力。mutation 在 resolver 内独立复验。

type DiscordUser {
  discordId: String!
  name: String!
  avatar: String
}

# 当前用户有管理权限 (Administrator/ManageGuild/服主) 的 Discord 服务器。
# 服务端已过滤: 下发的每一台都可用于建业/绑定, 不下发权限位给前端判断。
type DiscordServer {
  id: String!
  name: String!
  icon: String
}

# 百业成员名册条目 (代报名选人用): 名字口径与服务端落座一致
# (名册昵称, 回退全局名); globalName 供选择器在昵称重名时消歧。
type GuildRosterMember {
  discordId: ID!
  displayName: String!
  globalName: String
}

# 已绑定服务器 + 当前用户是成员: 完整数据
type Guild {
  slug: String!
  name: String
  slogan: String
  gameVersion: String!
  memberCount: Int!
  # 百业自定义头像 (管理员上传) 的版本化公开 URL; 无头像为 null。
  # 公开品牌图, Guild / GuildReadOnly 两面都下发 (Locked 不带内容数据)。
  avatarUrl: String
  groupings(tab: GroupingTab!): GroupingListPage!
  viewerNick: String
  # 成员名册: 仅完整 Guild 面声明 — GuildReadOnly / GuildLocked 无此
  # 字段, 权限由响应类型本身表达 (不下发任何权限标志位)。
  memberRoster: [GuildRosterMember!]!
  # 百业主页外壳文案 (shell gen 方法按请求 locale 生成)
  homeBackToHubLabel: String!
  homeTabTeamLabel: String!
  homeTabDexLabel: String!
  homeTabSectLabel: String!
  homeAdminLabel: String!
  detailNotFoundText: String!
  detailBackToListLabel: String!
}

# 未绑定 Discord 服务器: 公开可读, 写功能锁死 (该类型不含任何写入口)
type GuildReadOnly {
  slug: String!
  name: String
  slogan: String
  gameVersion: String!
  memberCount: Int!
  avatarUrl: String
  groupings(tab: GroupingTab!): GroupingListPage!
  viewerNick: String
  # 百业主页外壳文案 (shell gen 方法按请求 locale 生成)
  homeBackToHubLabel: String!
  homeTabTeamLabel: String!
  homeTabDexLabel: String!
  homeTabSectLabel: String!
  homeReadOnlyBanner: String!
  detailNotFoundText: String!
