# 燕云百业工具 v2 GraphQL Schema
# 按页面组织，非对象导向
# 当期 = version 字段匹配当前版本（如 intl-v2.3），无 isCurrent 布尔值
# 实体命名：Grouping（组队），非 Car

# ============ 枚举 ============

enum GroupingTab {
  ACTIVITY  # 双十人本
  TALENT    # 天赋组队
  RACE      # 竞速报名
  TOWER     # 爬塔
}

enum GroupingType {
  ACTIVITY
  TALENT
  RACE
  TOWER
}

enum DexTab {
  MECHANICS  # 机制
  TALENTS    # 天赋
  SHOUTS     # 喊话
}

# ============ 通用类型 ============

type Seat {
  index: Int!
  nickname: String
  weapon: String  # 流派，如 破竹·樽
  role: String    # 输出 / 奶（服务端按流派推导）
  uid: String
  occupied: Boolean!
}

type Dungeon {
  id: ID!
  name: String!
  version: String!      # 如 intl-v2.3
  playerCount: Int!     # 10人 / 5人
  size: Int!            # 同 playerCount (D1 dungeons.size), 供发车表单按副本定人数
  season: String        # 赛季码 S1..S5 (后端 dex 迁移写入, 未分类为 null)
  seasonName: String    # 赛季展示名 (后端赛季表: S1 出鞘之刃 / S2 Rewind / S3 Seek Within / S4 Forge Ahead / S5 Ever Aflame)
  category: String      # 游戏内分类 (试锋 / 梦洄 / 鉴心 / 铸矩 / 传薪), 与赛季等级档一一对应
  level: Int            # 副本等级档 (51/56/61/66/71/81/86/91/96/100)
  bosses: [Boss!]!
}

type Boss {
  id: ID!
  name: String!
  dungeon: Dungeon!
  mechanics: [Mechanic!]!  # 结构化机制
  talents: [Talent!]!      # 1-x / 2-x 天赋
  shouts: [Shout!]!        # 喊话宏
}

type Mechanic {
  phase: String!        # 如 "P1", "P2", "P3"
  title: String!
  description: String!  # 中文
}

type Talent {
  code: String!         # 如 "1-1", "2-3"
  description: String!  # 中文，视频确认标注
  verified: Boolean!    # 是否视频确认
}

type Shout {
  text: String!         # 喊话内容
  copyable: Boolean!
}

# ============ 页面：百业集结 Hub ============
# URL: /

type Query {
  hubPage: HubPage!
}

type HubPage {
  guilds: [GuildCard!]!
}

