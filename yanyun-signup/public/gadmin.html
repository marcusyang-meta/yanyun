<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · 百业报名站</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap" id="app">
  <div class="login-box" id="loginBox">
    <h2>🔐 管理登录</h2>
    <form id="loginForm">
      <label>管理员密码<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="primary" type="submit">登录</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>
  <div id="dash" style="display:none">
    <div class="admin-bar">
      <h2 style="margin:0">🛠️ 管理后台</h2>
      <div style="display:flex;gap:8px">
        <button class="ghost" onclick="location.href='./'">← 前台</button>
        <button class="ghost" id="logoutBtn">退出登录</button>
      </div>
    </div>

    <div class="detail">
      <h3 style="margin-top:0">⚙️ 百业设置</h3>
      <form id="settingsForm">
        <div class="grid2">
          <label>百业名称<input name="guild_name" maxlength="20"></label>
          <label>社主<input name="master_name" maxlength="20" placeholder="如：沈听澜"></label>
          <label class="full">公告<input name="announcement" maxlength="200"></label>
          <label class="full">口号 Slogan<input name="slogan" maxlength="50" placeholder="如：同舟共济，双十同行"></label>
          <label class="full">Logo 图片 URL<input name="logo_url" maxlength="300" placeholder="https://..."></label>
          <label class="full">背景图 URL<input name="bg_image_url" maxlength="300" placeholder="https://..."></label>
          <label class="full">Discord Webhook URL<input name="discord_webhook" maxlength="300" placeholder="https://discord.com/api/webhooks/..." style="font-size:12px"></label>
          <label class="full">Discord 服务器 ID（绑定后：仅该服务器成员可见并可发车/报名；留空 = 未绑定，写功能锁定）<input name="discord_guild_id" maxlength="25" placeholder="如 123456789012345678（Discord 里右键服务器图标 → 复制服务器 ID，需先开启开发者模式）" style="font-size:12px"></label>
        </div>
        <button class="primary" type="submit" style="width:auto">保存设置</button>
        <div class="msg" id="setMsg"></div>
      </form>
      <p style="color:var(--muted);font-size:12.5px;margin:10px 0 0">游戏版本与江湖快讯为全站统一，由超管维护。设置 Discord Webhook 后，新建活动/发车会自动推送到 Discord 频道。</p>
      <div style="margin-top:16px;border-top:1px solid rgba(255,255,255,.08);padding-top:14px">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <img id="avatarPreview" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid rgba(201,163,92,.45);display:none">
          <div id="avatarEmpty" style="width:64px;height:64px;border-radius:50%;border:1px dashed var(--muted);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;flex-shrink:0">无头像</div>
          <div style="flex:1;min-width:220px">
            <div style="font-weight:600;margin-bottom:4px">百业头像</div>
            <div style="color:var(--muted);font-size:12.5px;margin-bottom:8px">显示在百业页眉、选择页、Discord 提醒与分享图上。选图后自动裁成正方形并压缩（≤512×512、≤400KB），支持 PNG / JPEG / WebP。</div>
            <input type="file" id="avatarFile" accept="image/png,image/jpeg,image/webp" style="display:none">
            <button type="button" class="primary" id="avatarPickBtn" style="width:auto">上传 / 更换头像</button>
            <button type="button" id="avatarDelBtn" style="width:auto;display:none">删除头像</button>
          </div>
        </div>
        <div class="msg" id="avatarMsg"></div>
      </div>
      <div style="margin-top:12px;display:flex;align-items:center;gap:8px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="featTeams" style="width:18px;height:18px">
          <span>启用固定队功能 <span style="color:var(--muted);font-size:12px">(灰度测试中)</span></span>
        </label>
      </div>
    </div>

    <div class="detail" style="margin-top:16px">
      <div class="admin-bar" style="margin-top:0">
        <h3 style="margin:0">👥 固定队管理</h3>
        <button class="primary" id="newTeamBtn" style="width:auto">+ 新建固定队</button>
      </div>
      <div id="teamList"></div>
    </div>

    <div class="detail" style="margin-top:16px">
      <div class="admin-bar" style="margin-top:0">
        <h3 style="margin:0">📅 活动管理</h3>
        <button class="primary" id="newEvBtn" style="width:auto">+ 新建活动</button>
      </div>
      <div id="evList"></div>
    </div>

    <div class="detail" style="margin-top:16px" id="evDetailBox" hidden>
      <button class="back" id="evBack">← 返回活动列表</button>
      <h3 id="evTitle"></h3>
      <div class="toolbar">
        <button class="ghost" id="editEvBtn">✏️ 编辑活动</button>
        <button class="ghost" id="exportBtn">📥 导出报名表 CSV</button>
        <button class="danger" id="closeEvBtn">⏸ 截止/重开报名</button>
        <button class="danger" id="delEvBtn">🗑 删除活动</button>
      </div>
      <div class="section-t">👥 报名名单 <span class="n" id="sgCount"></span></div>
      <div style="overflow-x:auto"><table class="list" id="sgTable"></table></div>
      <div id="raceBox" hidden>
        <div class="section-t">🏆 成绩录入</div>
        <form id="resultForm">
          <div class="grid2">
            <label>队伍名 *<input name="team_name" required maxlength="40"></label>
            <label>成绩 *<input name="time" required placeholder="如 3:42.15"></label>
            <label class="full">队员<textarea name="members" maxlength="300"></textarea></label>
            <label>录像链接<input name="proof_url" maxlength="300" placeholder="https://"></label>
            <label>备注<input name="note" maxlength="200"></label>
          </div>
          <button class="primary" type="submit" style="width:auto">登记成绩</button>
          <div class="msg" id="resMsg"></div>
        </form>
        <table class="list" id="resTable" style="margin-top:12px"></table>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="evModal"><div class="box">
  <h3 id="evModalTitle" style="margin-top:0">新建活动</h3>
  <form id="evForm">
    <input type="hidden" name="id">
    <div class="grid2">
      <label>标题 *<input name="title" required maxlength="60"></label>
      <label>类型<select name="type"><option value="activity">双十人本</option><option value="talent">天赋组队</option><option value="race">竞速</option></select></label>
      <label>开始时间<input name="starts_at" type="datetime-local"></label>
      <label>名额上限<input name="max_slots" type="number" value="20" min="1" max="500"></label>
      <label class="full">集合信息<input name="meet_info" maxlength="200" placeholder="如: YY 频道 / 游戏内百业驻地集合"></label>
      <label class="full">活动说明<textarea name="description" maxlength="2000"></textarea></label>
    </div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="primary" type="submit" style="width:auto">保存</button>
      <button class="ghost" type="button" id="evCancel">取消</button>
    </div>
    <div class="msg" id="evMsg"></div>
  </form>
</div></div>

<script src="/gadmin.js"></script>
</body>
</html>
