name = "yanyun-og"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["global_fetch_strictly_public"]

# OG 图片子域名 (Custom Domain): og.yanyun.app 全部路径指向本 Worker;
# workers_dev 必须显式 true, 保留旧 yanyun-og.tbdlab.workers.dev 双绑。
workers_dev = true

[[routes]]
pattern = "og.yanyun.app"
custom_domain = true

# Explicit zone route for the same hostname — this is what actually
# receives production requests. Routes take precedence over custom
# domains on the same hostname, and the backend worker's wildcard
# route (*.yanyun.app/*, platform subdomains) therefore shadowed this
# worker's custom domain from 2026-10-27 until this carve-out landed:
# og.yanyun.app answered with the backend SPA and 404'd every image.
# This exact-host route outranks the wildcard; the custom domain
# above stays because it owns the DNS record and certificate.
[[routes]]
pattern = "og.yanyun.app/*"
zone_name = "yanyun.app"

# Pre-rendered generic brand image shipped as data/text modules so the
# fallback/hub path never renders (or fetches fonts) at request time.
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

[[rules]]
type = "Text"
globs = ["**/*.svg"]
fallthrough = true

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

# Guild share images stay warm in the edge cache so crawler fetches are
# static reads instead of cold renders (see `scheduled` in worker.js).
[triggers]
crons = ["*/20 * * * *"]
